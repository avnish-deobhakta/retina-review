<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Retina Review — BCSC Board Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* Color system — warm scholarly palette */
    --bg: #f4efe4;
    --bg-elevated: #faf6ec;
    --surface: #ffffff;
    --surface-soft: #fbf8f0;
    --ink: #1a1612;
    --ink-soft: #2a2520;
    --ink-muted: #6b655c;
    --ink-faint: #9a9388;
    --border: #d8cfba;
    --border-strong: #b8ad94;
    --accent: #7c2d3a;
    --accent-soft: #f3e1e3;
    --accent-hover: #621f2a;
    --success: #2c5f4e;
    --success-soft: #dde9e2;
    --error: #a8334a;
    --error-soft: #f4dde1;
    --warning: #b8651a;
    --warning-soft: #f5e3cd;
    --gold: #8b6f1f;
    --teal: #1f5c6f;
    --teal-soft: #d8e6eb;

    /* Typography */
    --font-serif: 'IBM Plex Serif', Georgia, serif;
    --font-sans: 'IBM Plex Sans', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', 'SF Mono', Consolas, monospace;

    /* Spacing & radius */
    --radius-sm: 4px;
    --radius: 6px;
    --radius-lg: 10px;
    --shadow-sm: 0 1px 2px rgba(26, 22, 18, 0.05);
    --shadow: 0 2px 8px rgba(26, 22, 18, 0.06), 0 1px 2px rgba(26, 22, 18, 0.04);
    --shadow-lg: 0 8px 24px rgba(26, 22, 18, 0.08), 0 2px 6px rgba(26, 22, 18, 0.04);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(124, 45, 58, 0.015) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(44, 95, 78, 0.015) 0%, transparent 40%);
    z-index: 0;
  }

  #app {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header.site-header {
    border-bottom: 1px solid var(--border);
    background: var(--bg-elevated);
    padding: 1rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 0.85rem;
    cursor: pointer;
    user-select: none;
  }

  .brand-avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--accent);
    background: var(--surface);
    flex-shrink: 0;
    transition: transform 0.2s ease, border-color 0.2s ease;
  }

  .brand:hover .brand-avatar {
    transform: scale(1.05);
    border-color: var(--accent-hover);
  }

  .brand-mark {
    font-family: var(--font-serif);
    font-weight: 600;
    font-style: italic;
    font-size: 1.5rem;
    color: var(--accent);
    letter-spacing: -0.01em;
  }

  .brand-title {
    font-family: var(--font-serif);
    font-weight: 500;
    font-size: 1.15rem;
    color: var(--ink);
    letter-spacing: -0.01em;
  }

  .brand-sub {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--ink-muted);
    border-left: 1px solid var(--border-strong);
    padding-left: 0.75rem;
  }

  .header-actions {
    display: flex;
    gap: 0.5rem;
    align-items: center;
  }

  main {
    flex: 1;
    padding: 2rem 1.5rem;
    width: 100%;
    max-width: 920px;
    margin: 0 auto;
  }

  .btn {
    font-family: var(--font-sans);
    font-size: 0.92rem;
    font-weight: 500;
    padding: 0.6rem 1.1rem;
    border-radius: var(--radius);
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    background: transparent;
    color: var(--ink);
  }

  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .btn-primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); box-shadow: var(--shadow); }

  .btn-secondary {
    background: var(--surface);
    color: var(--ink);
    border-color: var(--border-strong);
  }
  .btn-secondary:hover { background: var(--surface-soft); border-color: var(--ink-muted); }

  .btn-ghost {
    background: transparent;
    color: var(--ink-muted);
    border-color: transparent;
  }
  .btn-ghost:hover { color: var(--ink); background: var(--surface-soft); }

  .btn-large {
    padding: 0.9rem 1.6rem;
    font-size: 1rem;
  }

  /* Home view */
  .home-hero {
    padding: 2rem 0 2.5rem;
    text-align: center;
    border-bottom: 1px solid var(--border);
    margin-bottom: 2.5rem;
  }

  .home-eyebrow {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--accent);
    margin-bottom: 1rem;
  }

  .home-title {
    font-family: var(--font-serif);
    font-size: 2.5rem;
    font-weight: 500;
    line-height: 1.1;
    letter-spacing: -0.02em;
    color: var(--ink);
    margin-bottom: 0.75rem;
  }

  .home-title em {
    font-style: italic;
    color: var(--accent);
  }

  .home-sub {
    font-family: var(--font-serif);
    font-size: 1.1rem;
    color: var(--ink-muted);
    max-width: 540px;
    margin: 0 auto;
    font-style: italic;
  }

  .mode-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1rem;
    margin-bottom: 2.5rem;
  }

  @media (max-width: 900px) {
    .mode-grid { grid-template-columns: repeat(2, 1fr); }
  }

  @media (max-width: 640px) {
    .mode-grid { grid-template-columns: 1fr; }
    .home-title { font-size: 1.9rem; }
    main { padding: 1.5rem 1rem; }
  }

  .mode-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1.75rem;
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
    overflow: hidden;
  }

  .mode-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 4px;
    height: 100%;
    background: var(--accent);
    transform: scaleY(0);
    transform-origin: top;
    transition: transform 0.25s ease;
  }

  .mode-card:hover {
    border-color: var(--border-strong);
    box-shadow: var(--shadow);
    transform: translateY(-2px);
  }
  .mode-card:hover::before { transform: scaleY(1); }

  .mode-card.test::before { background: var(--gold); }
  .mode-card.mountain::before { background: var(--teal); }

  .mode-icon {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin-bottom: 0.5rem;
  }

  .mode-name {
    font-family: var(--font-serif);
    font-size: 1.5rem;
    font-weight: 500;
    color: var(--ink);
    margin-bottom: 0.5rem;
    letter-spacing: -0.01em;
  }

  .mode-desc {
    font-size: 0.92rem;
    color: var(--ink-muted);
    line-height: 1.55;
  }

  /* Stats panel */
  .stats-panel {
    background: var(--surface-soft);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1.5rem;
    margin-bottom: 2rem;
  }

  .stats-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 1.25rem;
    padding-bottom: 0.75rem;
    border-bottom: 1px dashed var(--border-strong);
  }

  .stats-title {
    font-family: var(--font-serif);
    font-size: 1.1rem;
    font-weight: 500;
    font-style: italic;
    color: var(--ink);
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1rem;
  }

  @media (max-width: 640px) {
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
  }

  .stat {
    text-align: left;
  }

  .stat-value {
    font-family: var(--font-serif);
    font-size: 1.75rem;
    font-weight: 500;
    color: var(--ink);
    line-height: 1.1;
    margin-bottom: 0.25rem;
  }

  .stat-label {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--ink-muted);
  }

  /* Dashboard view */
  .dashboard-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1.75rem;
    margin-bottom: 1.5rem;
  }

  @media (max-width: 640px) {
    .dashboard-section { padding: 1.25rem; }
  }

  .dashboard-section-title {
    font-family: var(--font-serif);
    font-size: 1.25rem;
    font-weight: 500;
    font-style: italic;
    color: var(--ink);
    margin-bottom: 0.35rem;
  }

  .dashboard-section-sub {
    font-family: var(--font-sans);
    font-size: 0.88rem;
    color: var(--ink-muted);
    margin-bottom: 1.5rem;
  }

  /* Chapter accuracy bars */
  .chapter-row {
    display: grid;
    grid-template-columns: 2.2rem 1fr 4.5rem 3.5rem;
    align-items: center;
    gap: 0.75rem;
    padding: 0.55rem 0;
    border-bottom: 1px dashed var(--border);
  }
  .chapter-row:last-child { border-bottom: none; }

  .chapter-row-num {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--ink-muted);
    text-align: right;
  }

  .chapter-row-name {
    font-family: var(--font-serif);
    font-size: 0.95rem;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .chapter-row-bar {
    position: relative;
    height: 8px;
    background: var(--surface-soft);
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
  }
  .chapter-row-bar-fill {
    position: absolute;
    top: 0; left: 0; bottom: 0;
    background: var(--success);
    transition: width 0.4s ease;
  }
  .chapter-row-bar-fill.weak { background: var(--error); }
  .chapter-row-bar-fill.medium { background: var(--warning); }

  .chapter-row-pct {
    font-family: var(--font-mono);
    font-size: 0.85rem;
    color: var(--ink);
    font-weight: 500;
    text-align: right;
  }
  .chapter-row-count {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--ink-faint);
    text-align: right;
  }
  .chapter-row.unseen .chapter-row-bar-fill { background: var(--border-strong); }
  .chapter-row.unseen .chapter-row-pct { color: var(--ink-faint); }

  /* Weak topics list */
  .weak-topic-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.7rem 1rem;
    background: var(--error-soft);
    border: 1px solid var(--error);
    border-radius: var(--radius);
    margin-bottom: 0.5rem;
    font-size: 0.92rem;
  }
  .weak-topic-row:last-child { margin-bottom: 0; }
  .weak-topic-name {
    font-family: var(--font-serif);
    color: var(--ink);
  }
  .weak-topic-name strong {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--error);
    margin-right: 0.5rem;
  }
  .weak-topic-stat {
    font-family: var(--font-mono);
    font-size: 0.82rem;
    color: var(--error);
    font-weight: 600;
  }

  /* Trend sparkline */
  .trend-row {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 0.6rem 0;
    border-bottom: 1px dashed var(--border);
  }
  .trend-row:last-child { border-bottom: none; }
  .trend-date {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--ink-muted);
    min-width: 5rem;
  }
  .trend-bar-wrap {
    flex: 1;
    position: relative;
    height: 6px;
    background: var(--surface-soft);
    border-radius: 3px;
    overflow: hidden;
  }
  .trend-bar {
    position: absolute;
    top: 0; left: 0; bottom: 0;
    background: var(--accent);
    transition: width 0.4s ease;
  }
  .trend-pct {
    font-family: var(--font-mono);
    font-size: 0.82rem;
    color: var(--ink);
    font-weight: 500;
    min-width: 3rem;
    text-align: right;
  }
  .trend-mode {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--ink-faint);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    min-width: 5rem;
  }

  @media (max-width: 640px) {
    .trend-mode { display: none; }
    .chapter-row { grid-template-columns: 1.8rem 1fr 3.5rem 2.5rem; gap: 0.5rem; }
  }

  /* Mountain Mode */
  .mountain-banner {
    background: linear-gradient(135deg, #1f5c6f 0%, #2a7a91 100%);
    color: #f4efe4;
    padding: 1.5rem 1.5rem 1rem;
    margin: -2rem -1.5rem 1.5rem;
    position: relative;
    overflow: hidden;
  }
  .mountain-banner::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.04) 40%, rgba(255,255,255,0.04) 50%, transparent 50%);
    pointer-events: none;
  }
  .mountain-banner-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
    position: relative;
  }
  .mountain-status {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    opacity: 0.85;
  }
  .mountain-elevation {
    font-family: var(--font-serif);
    font-size: 1.4rem;
    font-weight: 500;
    margin-top: 0.25rem;
  }
  .mountain-elevation em {
    font-style: italic;
    opacity: 0.8;
    font-size: 0.85em;
  }
  .mountain-streak {
    font-family: var(--font-mono);
    font-size: 0.85rem;
    text-align: right;
  }
  .mountain-streak-num {
    font-family: var(--font-serif);
    font-size: 1.5rem;
    font-weight: 500;
  }
  .mountain-progress-track {
    margin-top: 1rem;
    height: 4px;
    background: rgba(0,0,0,0.25);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
  }
  .mountain-progress-fill {
    height: 100%;
    background: #f5b86b;
    transition: width 0.4s ease;
  }
  .mountain-progress-marker {
    position: absolute;
    top: -2px;
    width: 2px;
    height: 8px;
    background: #fff;
    opacity: 0.9;
  }

  /* Mountain summit certificate */
  .summit-cert {
    background: var(--surface);
    border: 2px solid var(--teal);
    border-radius: var(--radius-lg);
    padding: 2.5rem 2rem;
    text-align: center;
    margin-bottom: 1.5rem;
    position: relative;
  }
  .summit-cert::before, .summit-cert::after {
    content: '';
    position: absolute;
    width: 30px; height: 30px;
    border: 2px solid var(--teal);
  }
  .summit-cert::before {
    top: 8px; left: 8px;
    border-right: none; border-bottom: none;
  }
  .summit-cert::after {
    bottom: 8px; right: 8px;
    border-left: none; border-top: none;
  }
  .summit-eyebrow {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--teal);
    margin-bottom: 0.75rem;
  }
  .summit-title {
    font-family: var(--font-serif);
    font-size: 2rem;
    font-weight: 500;
    color: var(--ink);
    margin-bottom: 0.5rem;
    letter-spacing: -0.01em;
  }
  .summit-title em { font-style: italic; color: var(--teal); }
  .summit-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1rem;
    margin: 1.5rem 0;
  }
  @media (max-width: 540px) {
    .summit-stats { grid-template-columns: 1fr; }
  }
  .summit-stat {
    padding: 1rem;
    background: var(--teal-soft);
    border-radius: var(--radius);
  }
  .summit-stat-val {
    font-family: var(--font-serif);
    font-size: 1.6rem;
    font-weight: 500;
    color: var(--teal);
    line-height: 1.1;
  }
  .summit-stat-lbl {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--ink-muted);
    margin-top: 0.25rem;
  }
  .summit-quote {
    font-family: var(--font-serif);
    font-style: italic;
    color: var(--ink-muted);
    margin-top: 1rem;
    font-size: 0.95rem;
  }

  /* Question UI */
  .question-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.25rem;
    flex-wrap: wrap;
    gap: 0.75rem;
  }

  .question-id {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--ink-muted);
    letter-spacing: 0.05em;
  }

  .question-counter {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--ink-muted);
  }

  .difficulty-badge {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    padding: 0.2rem 0.5rem;
    border-radius: var(--radius-sm);
    border: 1px solid;
  }

  .difficulty-easy { color: var(--success); border-color: var(--success); background: var(--success-soft); }
  .difficulty-medium { color: var(--warning); border-color: var(--warning); background: var(--warning-soft); }
  .difficulty-hard { color: var(--error); border-color: var(--error); background: var(--error-soft); }

  .topic-tag {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-muted);
    padding: 0.2rem 0.5rem;
    border-radius: var(--radius-sm);
    background: var(--surface-soft);
    border: 1px solid var(--border);
  }

  .question-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 2rem;
    box-shadow: var(--shadow-sm);
    margin-bottom: 1.5rem;
  }

  @media (max-width: 640px) {
    .question-card { padding: 1.25rem; }
  }

  .question-prompt {
    font-family: var(--font-serif);
    font-size: 1.15rem;
    line-height: 1.65;
    color: var(--ink);
    font-weight: 500;
    margin-bottom: 1.5rem;
    padding-bottom: 1.25rem;
    border-bottom: 1px dashed var(--border);
  }

  /* Image rendering for image-based questions */
  .question-image-figure {
    margin: 0 0 1.5rem;
    background: var(--surface-soft);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    text-align: center;
  }

  .question-image {
    display: block;
    max-width: 100%;
    max-height: 460px;
    margin: 0 auto;
    background: var(--ink-soft);
    object-fit: contain;
  }

  .question-image-loading {
    padding: 4rem 1rem;
    color: var(--ink-faint);
    font-family: var(--font-mono);
    font-size: 0.8rem;
    text-align: center;
  }

  .question-image-error {
    padding: 2rem 1rem;
    color: var(--ink-muted);
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 0.9rem;
    text-align: center;
  }

  .question-image-error a {
    color: var(--accent);
    text-decoration: underline;
  }

  .image-caption {
    padding: 0.6rem 1rem;
    background: var(--surface);
    border-top: 1px solid var(--border);
    font-family: var(--font-mono);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;

const STORAGE_KEY = "retinaReview.v2";

// Bumping IMAGE_VERSION forces browsers to re-fetch all question images even if
// they cached a 404 from a prior deploy. Increment this any time you re-upload
// or replace images in the /images folder.
const IMAGE_VERSION = 2;

const State = {
  mode: null,
  questionOrder: [],
  currentIdx: 0,
  answers: {},
  revealed: {},
  flagged: {},
  eliminated: {},
  hintsShown: {},
  testStartTime: null,
  testDurationSec: 0,
  testEndTime: null,
  timerInterval: null,
  config: {
    testCount: 10,
    pacingMode: "real",
    chapterFilter: "all",
    presetName: "sprint"
  },
  trainingConfig: {
    presetName: "sprint",
    chapterFilter: "images",
    customCount: 25
  },
  mountainConfig: {
    target: 20
  },
  mountain: null,
  currentMountainQ: null,
  currentMountainAnswer: null,
  currentMountainRevealed: false
};

const Stats = {
  load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return this.empty();
      return JSON.parse(raw);
    } catch (e) { return this.empty(); }
  },
  empty() {
    return {
      perQuestion: {},
      tests: []
    };
  },
  save(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  },
  recordAnswer(questionId, isCorrect) {
    const data = this.load();
    if (!data.perQuestion[questionId]) {
      data.perQuestion[questionId] = { seen: 0, correct: 0, lastSeen: null };
    }
    data.perQuestion[questionId].seen += 1;
    if (isCorrect) data.perQuestion[questionId].correct += 1;
    data.perQuestion[questionId].lastSeen = Date.now();
    this.save(data);
  },
  recordTest(score, total, durationSec, missedIds, mode) {
    const data = this.load();
    data.tests.push({
      date: Date.now(),
      score, total, durationSec,
      missed: missedIds,
      mode: mode || "custom"
    });
    this.save(data);
  },
  reset() {
    localStorage.removeItem(STORAGE_KEY);
  }
};

/* ============================================================
   HELPERS
   ============================================================ */
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function fmtTime(secs) {
  const h = Math.floor(secs / 3600);
  const m = Math.floor((secs % 3600) / 60);
  const s = secs % 60;
  if (h > 0) return `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  return `${m}:${String(s).padStart(2,"0")}`;
}

function fmtDuration(secs) {
  if (secs < 60) return `${secs} sec`;
  if (secs < 3600) return `${Math.round(secs/60)} min`;
  const h = Math.floor(secs / 3600);
  const m = Math.round((secs % 3600) / 60);
  return m > 0 ? `${h}h ${m}m` : `${h}h`;
}

function fmtDate(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
}

function difficultyClass(d) {
  return `difficulty-${d.toLowerCase()}`;
}

function letter(i) { return String.fromCharCode(65 + i); }

function questionsForChapter(chapter) {
  if (chapter === "all" || chapter === null || chapter === undefined) {
    return QUESTIONS.map((_, i) => i);
  }
  if (chapter === "images") {
    return QUESTIONS.map((q, i) => q.imageUrl ? i : -1).filter(i => i !== -1);
  }
  const ch = parseInt(chapter, 10);
  return QUESTIONS.map((q, i) => q.chapter === ch ? i : -1).filter(i => i !== -1);
}

function renderQuestionImage(q) {
  if (!q.imageUrl) return '';
  const credit = q.imageCredit || {};
  const sourceLabel = credit.source || 'External source';
  const sourceLink = q.imageSourceUrl || q.imageUrl;
  // The link text intentionally short — full attribution lives in the explanation panel below.
  return `
    <figure class="question-image-figure">
      <img class="question-image"
           src="${q.imageUrl}?v=${IMAGE_VERSION}"
           alt="${(credit.title || 'Clinical image').replace(/"/g, '&quot;')}"
           onerror="this.outerHTML = '<div class=\\'question-image-error\\'>Image could not be loaded. <a href=\\'${sourceLink}\\' target=\\'_blank\\' rel=\\'noopener\\'>View at ${sourceLabel} →</a></div>'" />
      <figcaption class="image-caption">
        <span>📷 Image courtesy of ${sourceLabel}</span>
        <a href="${sourceLink}" target="_blank" rel="noopener noreferrer">View original case →</a>
      </figcaption>
    </figure>
  `;
}

function renderImageAttribution(q) {
  if (!q.imageUrl || !q.imageCredit) return '';
  const c = q.imageCredit;
  const parts = [];
  if (c.title) parts.push(`<strong>"${c.title}"</strong>`);
  if (c.contributor) parts.push(`Contributor: ${c.contributor}`);
  if (c.photographer) parts.push(`Photographer: ${c.photographer}`);
  if (c.license) parts.push(`License: ${c.license}`);
  const sourceLink = q.imageSourceUrl || q.imageUrl;
  return `
    <div class="image-attribution">
      <span class="image-attribution-label">📷 Image Attribution</span>
      Image reproduced for noncommercial educational use from <strong>${c.source || 'external source'}</strong>.
      ${parts.length ? '<br>' + parts.join(' · ') : ''}
      <br><a href="${sourceLink}" target="_blank" rel="noopener noreferrer">View original case at source →</a>
    </div>
  `;
}

const App = {
  el: () => document.getElementById("view"),

  go(view, opts = {}) {
    if (State.timerInterval) {
      clearInterval(State.timerInterval);
      State.timerInterval = null;
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
    Views[view](opts);
  },

  exportProgress() {
    const data = Stats.load();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `retina-review-progress-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  },

  confirmReset() {
    Modal.show({
      title: "Reset all progress?",
      text: "This will clear all stats, scores, and test history stored on this device. This cannot be undone.",
      confirmLabel: "Reset everything",
      onConfirm: () => {
        Stats.reset();
        App.go("home");
      }
    });
  }
};

const Modal = {
  show({ title, text, confirmLabel = "Confirm", cancelLabel = "Cancel", onConfirm }) {
    const existing = document.querySelector(".modal-backdrop");
    if (existing) existing.remove();

    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    backdrop.innerHTML = `
      <div class="modal">
        <div class="modal-title">${title}</div>
        <div class="modal-text">${text}</div>
        <div class="modal-actions">
          <button class="btn btn-ghost" id="modal-cancel">${cancelLabel}</button>
          <button class="btn btn-primary" id="modal-confirm">${confirmLabel}</button>
        </div>
      </div>
    `;
    document.body.appendChild(backdrop);
    backdrop.querySelector("#modal-cancel").onclick = () => backdrop.remove();
    backdrop.querySelector("#modal-confirm").onclick = () => {
      backdrop.remove();
      onConfirm && onConfirm();
    };
    backdrop.onclick = (e) => { if (e.target === backdrop) backdrop.remove(); };
  }
};

          </div>

    `;
  },

  /* ---------- TRAINING SETUP ---------- */
  trainingSetup() {
    if (!State.trainingConfig.presetName) State.trainingConfig.presetName = "sprint";

    const TRAINING_PRESETS = {
      sprint: { name: "Sprint", count: 10, label: "10 random questions", desc: "Quick warm-up, mixed across all chapters." },
      marathon: { name: "Marathon", count: 50, label: "50 random questions", desc: "A longer learning session, mixed across all chapters." },
      chapter: { name: "Chapter Focus", count: null, label: "One chapter at a time", desc: "Drill a specific BCSC chapter end to end." },
      all: { name: "Everything", count: QUESTIONS.length, label: `All ${QUESTIONS.length} questions`, desc: "The whole bank, in book order or shuffled." }
    };

    const drawSetup = () => {
      const preset = TRAINING_PRESETS[State.trainingConfig.presetName];
      const isChapter = State.trainingConfig.presetName === "chapter";
      const isAll = State.trainingConfig.presetName === "all";

      // Self-correct: if Chapter Focus is selected but the filter value isn't a valid chapter
      // dropdown option (e.g. "all" was carried over from somewhere else), snap to "images".
      const validChapterOptions = ['images', ...Object.keys(CHAPTERS)];
      if (isChapter && !validChapterOptions.includes(State.trainingConfig.chapterFilter)) {
        State.trainingConfig.chapterFilter = 'images';
      }

      let willRunCount;
      if (isChapter) {
        willRunCount = questionsForChapter(State.trainingConfig.chapterFilter).length;
      } else if (isAll) {
        willRunCount = QUESTIONS.length;
      } else {
        willRunCount = preset.count;
      }

      App.el().innerHTML = `
        <div class="fade-in">
          <button class="btn btn-ghost" onclick="App.go('home')" style="margin-bottom: 1rem;">← Home</button>
          <div class="setup-card">
            <div class="setup-title">Training mode</div>
            <div class="setup-sub">Work at your own pace. After each answer you'll see the formal explanation, Dr. Deo's Pearl, and the BCSC reference.</div>

            <div class="field-group">
              <label class="field-label">How much do you want to do?</label>
              <div class="preset-grid" style="grid-template-columns: repeat(2, 1fr);">
                ${Object.entries(TRAINING_PRESETS).map(([key, p]) => `
                  <div class="preset-card ${State.trainingConfig.presetName === key ? 'active' : ''}" onclick="State.trainingConfig.presetName = '${key}'; Views._redrawTrainingSetup()">
                    <div class="preset-name">${p.name}</div>
                    <div class="preset-detail">${p.label}</div>
                    <div class="preset-meta">${p.desc}</div>
                  </div>
                `).join('')}
              </div>
            </div>

            ${isChapter ? `
              <div class="field-group">
                <label class="field-label">Which chapter?</label>
                <select class="chapter-select" onchange="State.trainingConfig.chapterFilter = this.value; Views._redrawTrainingSetup()">
                  <option value="images" ${State.trainingConfig.chapterFilter === 'images' ? 'selected' : ''}>📷 Image questions only · ${QUESTIONS.filter(q => q.imageUrl).length} q</option>
                  ${Object.entries(CHAPTERS).map(([num, name]) => {
                    const count = QUESTIONS.filter(q => q.chapter === parseInt(num)).length;
                    const sel = State.trainingConfig.chapterFilter === num ? 'selected' : '';
                    return `<option value="${num}" ${sel}>Ch ${num}: ${name} · ${count} q</option>`;
                  }).join('')}
                </select>
              </div>
            ` : ''}

            ${isAll ? `
              <div class="field-group">
                <label class="field-label">Order</label>
                <div class="field-options">
                  <button class="field-option ${State.trainingConfig.allOrder !== 'random' ? 'active' : ''}"
                          onclick="State.trainingConfig.allOrder = 'sequential'; Views._redrawTrainingSetup()">
                    Sequential (book order)
                  </button>
                  <button class="field-option ${State.trainingConfig.allOrder === 'random' ? 'active' : ''}"
                          onclick="State.trainingConfig.allOrder = 'random'; Views._redrawTrainingSetup()">
                    Shuffled
                  </button>
                </div>
              </div>
            ` : ''}

            <div class="pacing-info">
              You'll work through <strong>${willRunCount}</strong> question${willRunCount !== 1 ? 's' : ''}. ${isAll ? "You can quit anytime — your progress is saved." : "Take your time and use Dr. Deo's Hint and Narrow to 2 if you need them."}
            </div>

            <button class="btn btn-primary btn-large" style="width: 100%;" onclick="Views.trainingStart()">
              Start training
            </button>
          </div>
        </div>
      `;
    };
    Views._redrawTrainingSetup = drawSetup;
    drawSetup();
  },

  trainingStart() {
    State.mode = "training";
    const presetName = State.trainingConfig.presetName;
    let order;
    if (presetName === "sprint") {
      order = shuffle(QUESTIONS.map((_, i) => i)).slice(0, 10);
    } else if (presetName === "marathon") {
      order = shuffle(QUESTIONS.map((_, i) => i)).slice(0, 50);
    } else if (presetName === "chapter") {
      const validChapterOptions = ['images', ...Object.keys(CHAPTERS)];
      let chap = State.trainingConfig.chapterFilter;
      if (!validChapterOptions.includes(chap)) chap = 'images';
      order = shuffle(questionsForChapter(chap));
    } else { // "all"
      order = QUESTIONS.map((_, i) => i);
      if (State.trainingConfig.allOrder === "random") order = shuffle(order);
    }
    State.questionOrder = order;
    State.currentIdx = 0;
    State.answers = {};
    State.revealed = {};
    State.flagged = {};
    State.eliminated = {};
    State.hintsShown = {};
    Views.training();
  },

  training() {
    const qIdx = State.questionOrder[State.currentIdx];
    const q = QUESTIONS[qIdx];
    const userAnswer = State.answers[qIdx];
    const isRevealed = State.revealed[qIdx];
    const isFlagged = State.flagged[qIdx];
    const isEliminated = State.eliminated[qIdx];
    const hintShown = State.hintsShown[qIdx];
    const progressPct = ((State.currentIdx + 1) / State.questionOrder.length) * 100;

    App.el().innerHTML = `
      <div class="fade-in">
        <div class="action-bar" style="margin-bottom: 0.5rem;">
          <button class="btn btn-ghost" onclick="App.go('home')">← Home</button>
          <span class="question-counter">Question ${State.currentIdx + 1} of ${State.questionOrder.length}</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width: ${progressPct}%"></div></div>

        <div class="question-meta">
          <div style="display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap;">
            <span class="question-id">${q.id}</span>
            <span class="difficulty-badge ${difficultyClass(q.difficulty)}">${q.difficulty}</span>
            <span class="topic-tag">Ch ${q.chapter} · ${q.topic}</span>
            ${q.imageUrl ? '<span class="image-badge">📷 Image</span>' : ''}
          </div>
          <button class="flag-btn ${isFlagged ? 'flagged' : ''}" onclick="Views._toggleFlag(${qIdx})">
            ${isFlagged ? '★ Flagged' : '☆ Flag'}
          </button>
        </div>

        <div class="question-card">
          ${renderQuestionImage(q)}
          <div class="question-prompt">${q.prompt}</div>

          ${hintShown && !isRevealed && q.informal ? `
            <div class="hint-box">
              <span class="hint-label"><img src="${DEO_AVATAR}" class="deo-avatar deo-avatar-warning" alt="Dr. Deo" /> Dr. Deo's Hint</span>
              <div class="hint-text">${q.informal}</div>
            </div>
          ` : ''}

          <div class="choices">
            ${q.choices.map((c, i) => {
              let cls = "choice";
              const isElim = isEliminated && isEliminated.includes(i);
              if (isRevealed) {
                if (i === q.correct) cls += " correct";
                else if (i === userAnswer) cls += " incorrect";
                else if (isElim) cls += " eliminated";
              } else {
                if (isElim) cls += " eliminated";
                if (userAnswer === i) cls += " selected";
              }
              return `
                <button class="${cls}" onclick="Views._selectTraining(${i})" ${isRevealed || isElim ? 'disabled' : ''}>
                  <span class="choice-letter">${letter(i)}</span>
                  <span>${c}</span>
                </button>
              `;
            }).join('')}
          </div>

          ${isRevealed ? `
            <div class="explanation-box">
              <div class="explanation-header">
                <span class="explanation-label">Explanation</span>
                <span class="answer-pill ${userAnswer !== q.correct ? 'was-wrong' : ''}">
                  Answer: ${letter(q.correct)}
                </span>
              </div>
              ${(userAnswer !== q.correct && userAnswer !== undefined && q.wrongExplanations && q.wrongExplanations[userAnswer]) ? `
                <div class="wrong-answer-block">
                  <span class="wrong-answer-label">Why your answer was wrong</span>
                  <div class="wrong-answer-text"><strong>${letter(userAnswer)}.</strong>${q.wrongExplanations[userAnswer]}</div>
                </div>
              ` : ''}
              <div class="formal-block">${q.formal}</div>
              ${q.informal ? `
                <div class="pearl-block">
                  <span class="pearl-label"><img src="${DEO_AVATAR}" class="deo-avatar" alt="Dr. Deo" /> Dr. Deo's Pearl</span>
                  <div class="pearl-text">${q.informal}</div>
                </div>
              ` : ''}
              <span class="reference-tag">📖 ${q.reference}</span>
              ${renderImageAttribution(q)}
            </div>
          ` : ''}
        </div>

        <div class="action-bar">
          <div class="action-group">
            ${!isRevealed ? `
              ${q.informal ? `
                <button class="btn btn-ghost deo-hint-btn" onclick="Views._showHint()" ${hintShown ? 'disabled' : ''}>
                  <img src="${DEO_AVATAR}" alt="Dr. Deo" />
                  ${hintShown ? "✓ Hint shown" : "Dr. Deo's Hint"}
                </button>
              ` : ''}
              <button class="btn btn-ghost" onclick="Views._narrowChoices()" ${isEliminated ? 'disabled' : ''}>
                ${isEliminated ? '✓ Narrowed' : 'Narrow to 2'}
              </button>
            ` : ''}
          </div>
          <div class="action-group">
            <button class="btn btn-secondary" onclick="Views._navTraining(-1)" ${State.currentIdx === 0 ? 'disabled' : ''}>← Prev</button>
            ${!isRevealed ? `
              <button class="btn btn-primary" onclick="Views._checkAnswer()" ${userAnswer === undefined ? 'disabled' : ''}>
                Check answer
              </button>
            ` : `
              ${State.currentIdx === State.questionOrder.length - 1 ?
                `<button class="btn btn-primary" onclick="App.go('home')">Finish session</button>` :
                `<button class="btn btn-primary" onclick="Views._navTraining(1)">Next →</button>`
              }
            `}
          </div>
        </div>
      </div>
    `;
  },

  _selectTraining(choiceIdx) {
    const qIdx = State.questionOrder[State.currentIdx];
    if (State.revealed[qIdx]) return;
    if (State.eliminated[qIdx] && State.eliminated[qIdx].includes(choiceIdx)) return;
    State.answers[qIdx] = choiceIdx;
    Views.training();
  },

  _checkAnswer() {
    const qIdx = State.questionOrder[State.currentIdx];
    const q = QUESTIONS[qIdx];
    const userAnswer = State.answers[qIdx];
    if (userAnswer === undefined) return;
    State.revealed[qIdx] = true;
    Stats.recordAnswer(q.id, userAnswer === q.correct);
    Views.training();
  },

  _showHint() {
    const qIdx = State.questionOrder[State.currentIdx];
    if (State.revealed[qIdx]) return;
    State.hintsShown[qIdx] = true;
    Views.training();
  },

  _narrowChoices() {
    const qIdx = State.questionOrder[State.currentIdx];
    if (State.revealed[qIdx]) return;
    if (State.eliminated[qIdx]) return;

    const q = QUESTIONS[qIdx];
    const userAnswer = State.answers[qIdx];
    const totalChoices = q.choices.length;
    const numToEliminate = totalChoices - 2;

    let candidates = [];
    for (let i = 0; i < totalChoices; i++) {
      if (i !== q.correct && i !== userAnswer) candidates.push(i);
    }
    candidates = shuffle(candidates).slice(0, numToEliminate);
    State.eliminated[qIdx] = candidates;
    Views.training();
  },

  _navTraining(direction) {
    State.currentIdx += direction;
    if (State.currentIdx < 0) State.currentIdx = 0;
    if (State.currentIdx >= State.questionOrder.length) State.currentIdx = State.questionOrder.length - 1;
    Views.training();
  },

  _toggleFlag(qIdx) {
    State.flagged[qIdx] = !State.flagged[qIdx];
    if (State.mode === "training") Views.training();
    else Views.test();
  },

  /* ---------- TEST SETUP ---------- */
  testSetup() {
    if (!State.config.presetName) State.config.presetName = "sprint";

    const PRESETS = {
      sprint: { name: "Sprint", count: 10, label: "10 questions · ~12 min", desc: "Quick warm-up. Real ABO pacing." },
      marathon: { name: "Marathon", count: 50, label: "50 questions · ~1 hour", desc: "Real test stamina. ABO pacing." },
      mock: { name: "Mock Board", count: 250, label: "250 questions · 5 hours", desc: "Full WQE simulation. Real ABO pacing." }
    };

    const drawSetup = () => {
      const preset = PRESETS[State.config.presetName] || null;
      const isCustom = State.config.presetName === "custom";
      const filteredCount = questionsForChapter(State.config.chapterFilter).length;
      const requestedCount = isCustom ? State.config.testCount : (preset ? preset.count : 10);
      const actualCount = Math.min(requestedCount, filteredCount);
      const totalSec = State.config.pacingMode === "real" ? actualCount * 72 : null;

      App.el().innerHTML = `
        <div class="fade-in">
          <button class="btn btn-ghost" onclick="App.go('home')" style="margin-bottom: 1rem;">← Home</button>
          <div class="setup-card">
            <div class="setup-title">Configure your test</div>
            <div class="setup-sub">The real ABO Written Qualifying Exam runs 250 questions in 5 hours — 72 seconds per question. Pick your distance.</div>

            <div class="field-group">
              <label class="field-label">Preset</label>
              <div class="preset-grid">
                ${Object.entries(PRESETS).map(([key, p]) => `
                  <div class="preset-card ${State.config.presetName === key ? 'active' : ''}" onclick="State.config.presetName = '${key}'; State.config.pacingMode = 'real'; Views._redrawTestSetup()">
                    <div class="preset-name">${p.name}</div>
                    <div class="preset-detail">${p.label}</div>
                    <div class="preset-meta">${p.desc}</div>
                  </div>
                `).join('')}
              </div>

              <div class="field-options">
                <button class="field-option ${isCustom ? 'active' : ''}"
                        onclick="State.config.presetName = 'custom'; Views._redrawTestSetup()">
                  Custom...
                </button>
              </div>

              ${isCustom ? `
                <div style="margin-top: 1rem; display: flex; gap: 1.25rem; align-items: center; flex-wrap: wrap;">
                  <div class="number-input">
                    <label style="font-family: var(--font-sans); font-size: 0.9rem; color: var(--ink-muted);">Questions:</label>
                    <input type="number" min="1" max="500" value="${State.config.testCount}"
                           oninput="State.config.testCount = parseInt(this.value) || 1; Views._redrawTestSetup()" />
                  </div>
                  <div class="field-options">
                    <button class="field-option ${State.config.pacingMode === 'real' ? 'active' : ''}"
                            onclick="State.config.pacingMode = 'real'; Views._redrawTestSetup()">
                      Timed (72s/q)
                    </button>
                    <button class="field-option ${State.config.pacingMode === 'untimed' ? 'active' : ''}"
                            onclick="State.config.pacingMode = 'untimed'; Views._redrawTestSetup()">
                      Untimed
                    </button>
                  </div>
                </div>
              ` : ''}
            </div>

            <div class="field-group">
              <label class="field-label">Focus area</label>
              <select class="chapter-select" onchange="State.config.chapterFilter = this.value; Views._redrawTestSetup()">
                <option value="all" ${State.config.chapterFilter === 'all' ? 'selected' : ''}>All chapters · ${QUESTIONS.length} questions</option>
                <option value="images" ${State.config.chapterFilter === 'images' ? 'selected' : ''}>📷 Image questions only · ${QUESTIONS.filter(q => q.imageUrl).length} q</option>
                ${Object.entries(CHAPTERS).map(([num, name]) => {
                  const count = QUESTIONS.filter(q => q.chapter === parseInt(num)).length;
                  return `<option value="${num}" ${State.config.chapterFilter === num ? 'selected' : ''}>Ch ${num}: ${name} · ${count} q</option>`;
                }).join('')}
              </select>
              ${State.config.chapterFilter !== 'all' && requestedCount > filteredCount ? `
                <div class="small-info">Note: this selection has only ${filteredCount} questions. Test will use all of them.</div>
              ` : ''}
            </div>

            <div class="pacing-info">
              ${State.config.pacingMode === "real" || !isCustom ?
                `You'll have <strong>${fmtTime(totalSec)}</strong> to answer <strong>${actualCount}</strong> question${actualCount !== 1 ? 's' : ''}. The clock starts when you click Begin.` :
                `<strong>${actualCount}</strong> questions, untimed. No clock pressure.`
              }
            </div>

            <button class="btn btn-primary btn-large" style="width: 100%;" onclick="Views.testStart()">
              Begin test
            </button>
          </div>
        </div>
      `;
    };
    Views._redrawTestSetup = drawSetup;
    drawSetup();
  },

  testStart() {
    const PRESETS = {
      sprint: 10, marathon: 50, mock: 250
    };
    const isCustom = State.config.presetName === "custom";
    const requestedCount = isCustom ? State.config.testCount : (PRESETS[State.config.presetName] || 10);

    State.mode = "test";
    const pool = questionsForChapter(State.config.chapterFilter);
    const actualCount = Math.min(requestedCount, pool.length);
    State.questionOrder = shuffle(pool).slice(0, actualCount);
    State.currentIdx = 0;
    State.answers = {};
    State.flagged = {};
    State.revealed = {};
    State.eliminated = {};
    State.testStartTime = Date.now();
    const useTimer = !isCustom || State.config.pacingMode === "real";
    State.testDurationSec = useTimer ? actualCount * 72 : null;
    State.testEndTime = State.testDurationSec ? State.testStartTime + State.testDurationSec * 1000 : null;
    Views.test();
    if (State.testDurationSec) Views._startTimer();
  },

  test() {
    const qIdx = State.questionOrder[State.currentIdx];
    const q = QUESTIONS[qIdx];
    const userAnswer = State.answers[qIdx];
    const isFlagged = State.flagged[qIdx];

    const headerHtml = `
      <div class="test-header" style="margin: -2rem -1.5rem 1.5rem;">
        <div class="test-header-info">
          <span>Test Mode</span>
          <span style="opacity:0.6;">·</span>
          <span>Q ${State.currentIdx + 1} / ${State.questionOrder.length}</span>
        </div>
        <div class="test-header-info">
          ${State.testDurationSec ? `<div class="timer" id="timer">--:--</div>` : `<span style="opacity:0.6;">Untimed</span>`}
          <button class="btn btn-secondary" style="font-size:0.8rem;padding:0.4rem 0.8rem;" onclick="Views._confirmEndTest()">End test</button>
        </div>
      </div>
    `;

    App.el().innerHTML = `
      <div class="fade-in">
        ${headerHtml}

        <div class="question-meta">
          <div style="display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap;">
            <span class="question-id">${q.id}</span>
            ${q.imageUrl ? '<span class="image-badge">📷 Image</span>' : ''}
          </div>
          <button class="flag-btn ${isFlagged ? 'flagged' : ''}" onclick="Views._toggleFlag(${qIdx})">
            ${isFlagged ? '★ Flagged' : '☆ Flag for review'}
          </button>
        </div>

        <div class="question-card">
          ${renderQuestionImage(q)}
          <div class="question-prompt">${q.prompt}</div>

          <div class="choices">
            ${q.choices.map((c, i) => {
              const cls = "choice" + (userAnswer === i ? " selected" : "");
              return `
                <button class="${cls}" onclick="Views._selectTest(${i})">
                  <span class="choice-letter">${letter(i)}</span>
                  <span>${c}</span>
                </button>
              `;
            }).join('')}
          </div>
        </div>

        <div class="action-bar" style="margin-bottom: 2rem;">
          <button class="btn btn-secondary" onclick="Views._navTest(-1)" ${State.currentIdx === 0 ? 'disabled' : ''}>← Prev</button>
          <span class="question-counter">${Object.keys(State.answers).length} of ${State.questionOrder.length} answered</span>
          ${State.currentIdx === State.questionOrder.length - 1 ?
            `<button class="btn btn-primary" onclick="Views._confirmSubmit()">Submit test</button>` :
            `<button class="btn btn-primary" onclick="Views._navTest(1)">Next →</button>`
          }
        </div>

        <div class="stats-panel">
          <div class="stats-header">
            <div class="stats-title">Question navigator</div>
            <div style="font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-muted);">
              <span style="color: var(--accent);">●</span> Answered &nbsp;
              <span style="color: var(--gold);">●</span> Flagged
            </div>
          </div>
          <div class="nav-grid">
            ${State.questionOrder.map((idx, i) => {
              let cls = "nav-cell";
              if (State.answers[idx] !== undefined) cls += " answered";
              if (State.flagged[idx]) cls += " flagged";
              if (i === State.currentIdx) cls += " current";
              return `<div class="${cls}" onclick="Views._jumpTo(${i})">${i + 1}</div>`;
            }).join('')}
          </div>
        </div>
      </div>
    `;

    if (State.testDurationSec) Views._updateTimer();
  },

  _startTimer() {
    if (State.timerInterval) clearInterval(State.timerInterval);
    State.timerInterval = setInterval(() => {
      Views._updateTimer();
    }, 1000);
  },

  _updateTimer() {
    const timerEl = document.getElementById("timer");
    if (!timerEl) return;
    const remaining = Math.max(0, Math.floor((State.testEndTime - Date.now()) / 1000));
    timerEl.textContent = fmtTime(remaining);
    timerEl.classList.remove("warning", "critical");
    const totalSec = State.testDurationSec;
    if (remaining <= 30 || remaining / totalSec < 0.05) timerEl.classList.add("critical");
    else if (remaining / totalSec < 0.2) timerEl.classList.add("warning");

    if (remaining <= 0) {
      clearInterval(State.timerInterval);
      State.timerInterval = null;
      Views._submitTest();
    }
  },

  _selectTest(choiceIdx) {
    const qIdx = State.questionOrder[State.currentIdx];
    State.answers[qIdx] = choiceIdx;
    Views.test();
  },

  _navTest(direction) {
    State.currentIdx += direction;
    if (State.currentIdx < 0) State.currentIdx = 0;
    if (State.currentIdx >= State.questionOrder.length) State.currentIdx = State.questionOrder.length - 1;
    Views.test();
  },

  _jumpTo(idx) {
    State.currentIdx = idx;
    Views.test();
  },

  _confirmSubmit() {
    const unanswered = State.questionOrder.filter(i => State.answers[i] === undefined).length;
    Modal.show({
      title: "Submit your test?",
      text: unanswered > 0 ?
        `You have ${unanswered} unanswered question${unanswered > 1 ? 's' : ''}. They will be marked incorrect.` :
        "All questions answered. Ready to see your results?",
      confirmLabel: "Submit",
      onConfirm: Views._submitTest
    });
  },

  _confirmEndTest() {
    Modal.show({
      title: "End test early?",
      text: "Your current answers will be scored. Unanswered questions will be marked incorrect.",
      confirmLabel: "End test",
      onConfirm: Views._submitTest
    });
  },

  _submitTest() {
    if (State.timerInterval) {
      clearInterval(State.timerInterval);
      State.timerInterval = null;
    }
    let correct = 0;
    const missedIds = [];
    State.questionOrder.forEach(idx => {
      const q = QUESTIONS[idx];
      const userAns = State.answers[idx];
      const isCorrect = userAns === q.correct;
      Stats.recordAnswer(q.id, isCorrect);
      if (isCorrect) correct += 1;
      else missedIds.push(q.id);
    });
    const elapsedSec = Math.floor((Date.now() - State.testStartTime) / 1000);
    const presetName = State.config.presetName === "custom" ? "custom" : State.config.presetName;
    Stats.recordTest(correct, State.questionOrder.length, elapsedSec, missedIds, presetName);
    Views.testResults({ correct, elapsedSec });
  },

  /* ---------- DASHBOARD ---------- */
  dashboard() {
    const data = Stats.load();
    const totalSeen = Object.values(data.perQuestion).reduce((s, q) => s + q.seen, 0);
    const totalCorrect = Object.values(data.perQuestion).reduce((s, q) => s + q.correct, 0);
    const overallAcc = totalSeen > 0 ? Math.round((totalCorrect / totalSeen) * 100) : 0;
    const uniqueSeen = Object.keys(data.perQuestion).length;

    // --- Per-chapter accuracy ---
    // For each chapter, sum up seen/correct for questions belonging to it.
    const chapterStats = {};
    Object.keys(CHAPTERS).forEach(ch => {
      chapterStats[ch] = { seen: 0, correct: 0, total: 0, name: CHAPTERS[ch] };
    });
    QUESTIONS.forEach(q => {
      const ch = String(q.chapter);
      if (!chapterStats[ch]) return;
      chapterStats[ch].total += 1;
      const stat = data.perQuestion[q.id];
      if (stat) {
        chapterStats[ch].seen += stat.seen;
        chapterStats[ch].correct += stat.correct;
      }
    });

    const chapterRows = Object.entries(chapterStats).map(([ch, s]) => {
      const acc = s.seen > 0 ? Math.round((s.correct / s.seen) * 100) : null;
      return { ch, ...s, acc };
    });

    // --- Weak topics ---
    // Group attempts by topic (q.topic), require at least 3 attempts to be considered.
    // Sort by accuracy ascending; keep bottom 5.
    const topicMap = {};
    QUESTIONS.forEach(q => {
      const stat = data.perQuestion[q.id];
      if (!stat || stat.seen === 0) return;
      if (!topicMap[q.topic]) topicMap[q.topic] = { seen: 0, correct: 0, chapter: q.chapter };
      topicMap[q.topic].seen += stat.seen;
      topicMap[q.topic].correct += stat.correct;
    });
    const weakTopics = Object.entries(topicMap)
      .filter(([_, s]) => s.seen >= 3)
      .map(([topic, s]) => ({
        topic, ...s,
        acc: Math.round((s.correct / s.seen) * 100)
      }))
      .filter(t => t.acc < 70)
      .sort((a, b) => a.acc - b.acc)
      .slice(0, 5);

    // --- Recent test trend (last 10) ---
    const recentTests = [...data.tests].slice(-10).reverse();

    App.el().innerHTML = `

          <div class="empty-state" style="padding: 4rem 1rem;">
            No data yet. Answer a few questions in Training or Test mode and come back —<br>
            this page will fill in as you go.
          </div>
        ` : `

        <div class="dashboard-section">
          <div class="dashboard-section-title">Overview</div>
          <div class="dashboard-section-sub">Across every question you've attempted in this device's storage.</div>
          <div class="stats-grid">
            <div class="stat">
              <div class="stat-value">${uniqueSeen}<span style="color:var(--ink-faint);font-size:0.7em;"> / ${QUESTIONS.length}</span></div>
              <div class="stat-label">Unique questions seen</div>
            </div>
            <div class="stat">
              <div class="stat-value">${totalSeen}</div>
              <div class="stat-label">Total attempts</div>
            </div>
            <div class="stat">
              <div class="stat-value">${overallAcc}%</div>
              <div class="stat-label">Overall accuracy</div>
            </div>
            <div class="stat">
              <div class="stat-value">${data.tests.length}</div>
              <div class="stat-label">Tests completed</div>
            </div>
          </div>
        </div>

        <div class="dashboard-section">
          <div class="dashboard-section-title">Accuracy by chapter</div>
          <div class="dashboard-section-sub">Bars show how often you've gotten questions right in each chapter. Faded gray means you haven't seen any yet.</div>
          ${chapterRows.map(r => {
            const fillClass = r.acc === null ? 'unseen' :
              (r.acc < 60 ? 'weak' : r.acc < 80 ? 'medium' : '');
            const width = r.acc === null ? 0 : r.acc;
            return `
              <div class="chapter-row ${r.acc === null ? 'unseen' : ''}">
                <span class="chapter-row-num">Ch ${r.ch}</span>
                <span class="chapter-row-name" title="${r.name}">${r.name}</span>
                <div class="chapter-row-bar">
                  <div class="chapter-row-bar-fill ${fillClass}" style="width: ${width}%;"></div>
                </div>
                <div style="text-align:right;">
                  <div class="chapter-row-pct">${r.acc === null ? '—' : r.acc + '%'}</div>
                  <div class="chapter-row-count">${r.seen > 0 ? r.seen + '/' + r.total : '0/' + r.total}</div>
                </div>
              </div>
            `;
          }).join('')}
        </div>

        ${weakTopics.length > 0 ? `
        <div class="dashboard-section">
          <div class="dashboard-section-title">Weak topics</div>
          <div class="dashboard-section-sub">Topics where you've answered &lt; 70% correct and seen at least 3 attempts. These are good drill candidates.</div>
          ${weakTopics.map(t => `
            <div class="weak-topic-row">
              <span class="weak-topic-name"><strong>Ch ${t.chapter}</strong>${t.topic}</span>
              <span class="weak-topic-stat">${t.acc}% · ${t.correct}/${t.seen}</span>
            </div>
          `).join('')}
        </div>
        ` : `
        <div class="dashboard-section">
          <div class="dashboard-section-title">Weak topics</div>
          <div class="dashboard-section-sub">Once you've attempted at least 3 questions on a given topic and gotten less than 70% right, it'll show up here. Keep going.</div>
        </div>
        `}

        ${recentTests.length > 0 ? `
        <div class="dashboard-section">
          <div class="dashboard-section-title">Recent tests</div>
          <div class="dashboard-section-sub">Your last ${recentTests.length} timed test${recentTests.length > 1 ? 's' : ''}, newest first.</div>
          ${recentTests.map(t => {
            const pct = Math.round((t.score / t.total) * 100);
            return `
              <div class="trend-row">
                <span class="trend-date">${fmtDate(t.date)}</span>
                <span class="trend-mode">${(t.mode || 'custom').toUpperCase()}</span>
                <div class="trend-bar-wrap">
                  <div class="trend-bar" style="width:${pct}%; background:${pct >= 70 ? 'var(--success)' : pct >= 50 ? 'var(--warning)' : 'var(--error)'};"></div>

  /* ---------- MOUNTAIN MODE SETUP ---------- */
  mountainSetup() {
    App.el().innerHTML = `

  mountainStart() {
    State.mode = "mountain";
    State.mountainConfig = State.mountainConfig || { target: 20 };
    const target = State.mountainConfig.target || 20;

    // Bucket questions by difficulty
    const buckets = {
      easy: QUESTIONS.map((q, i) => q.difficulty === "Easy" ? i : -1).filter(i => i !== -1),
      medium: QUESTIONS.map((q, i) => q.difficulty === "Medium" ? i : -1).filter(i => i !== -1),
      hard: QUESTIONS.map((q, i) => q.difficulty === "Hard" ? i : -1).filter(i => i !== -1)
    };
    State.mountain = {
      target,
      level: 1,                      // 1 = Foothills (Easy), 2 = Ridge (Medium), 3 = Summit (Hard)
      streakCorrect: 0,
      streakWrong: 0,
      peakLevel: 1,
      summitTimeSec: 0,             // seconds spent at level 3
      summitStartTime: null,        // when current summit visit began
      currentLevelStartTime: Date.now(),
      buckets,
      usedQuestions: new Set(),
      questionsAnswered: 0,
      correctAnswered: 0,
      history: [],                   // {qid, level, correct}
      startTime: Date.now()
    };
    State.currentMountainQ = null;
    State.currentMountainAnswer = null;
    State.currentMountainRevealed = false;
    Views.mountain();
  },

  mountain() {
    const m = State.mountain;
    if (!m) { App.go("home"); return; }

    // Check finish condition
    if (m.questionsAnswered >= m.target) {
      Views.mountainSummit();
      return;
    }

    // Pick next question if needed
    if (!State.currentMountainQ) {
      const bucketName = m.level === 1 ? "easy" : m.level === 2 ? "medium" : "hard";
      const bucket = m.buckets[bucketName];
      // Filter out used; if exhausted, allow reuse rather than crashing
      let available = bucket.filter(i => !m.usedQuestions.has(i));
      if (available.length === 0) available = bucket;
      const qIdx = available[Math.floor(Math.random() * available.length)];
      m.usedQuestions.add(qIdx);
      State.currentMountainQ = qIdx;
      State.currentMountainAnswer = null;
      State.currentMountainRevealed = false;
    }

    const qIdx = State.currentMountainQ;
    const q = QUESTIONS[qIdx];
    const userAnswer = State.currentMountainAnswer;
    const revealed = State.currentMountainRevealed;

    const levelName = m.level === 1 ? "Foothills" : m.level === 2 ? "Ridge" : "Summit";
    const levelEmoji = m.level === 1 ? "🌲" : m.level === 2 ? "⛰️" : "🏔️";
    const peakName = m.peakLevel === 1 ? "Foothills" : m.peakLevel === 2 ? "Ridge" : "Summit";

    // Progress toward next level (3 correct in a row to ascend)
    const ascendProgress = m.level < 3 ? (m.streakCorrect / 3) * 100 : 100;
    const overallProgressPct = (m.questionsAnswered / m.target) * 100;

    App.el().innerHTML = `
      <div class="fade-in">
        <div class="mountain-banner">
          <div class="mountain-banner-row">
            <div>
              <div class="mountain-status">${levelEmoji} ${levelName} · Level ${m.level} of 3</div>
              <div class="mountain-elevation">Peak so far: <em>${peakName}</em></div>
            </div>
            <div class="mountain-streak">
              <div class="mountain-streak-num">${m.streakCorrect}</div>
              <div class="mountain-status">${m.level < 3 ? 'Streak to ascend' : 'Holding the summit'}</div>
            </div>
          </div>
          <div class="mountain-progress-track" title="Progress through this climb">
            <div class="mountain-progress-fill" style="width: ${overallProgressPct}%;"></div>
          </div>
          <div style="font-family:var(--font-mono); font-size:0.7rem; opacity:0.85; margin-top:0.4rem; letter-spacing:0.05em;">
            Question ${m.questionsAnswered + 1} of ${m.target}
          </div>
        </div>

        <div class="question-meta">
          <div style="display:flex; gap:0.5rem; align-items:center; flex-wrap:wrap;">
            <span class="question-id">${q.id}</span>
            <span class="difficulty-badge ${difficultyClass(q.difficulty)}">${q.difficulty}</span>
            <span class="topic-tag">Ch ${q.chapter} · ${q.topic}</span>
            ${q.imageUrl ? '<span class="image-badge">📷 Image</span>' : ''}
          </div>
          <button class="btn btn-secondary" style="font-size:0.8rem;padding:0.4rem 0.8rem;" onclick="Views._mountainAbort()">End climb</button>
        </div>

        <div class="question-card">
          ${renderQuestionImage(q)}
          <div class="question-prompt">${q.prompt}</div>

          <div class="choices">
            ${q.choices.map((c, i) => {
              let cls = "choice";
              if (revealed) {
                if (i === q.correct) cls += " correct";
                else if (i === userAnswer) cls += " incorrect";
              } else if (userAnswer === i) {
                cls += " selected";
              }
              return `
                <button class="${cls}" onclick="Views._mountainSelect(${i})" ${revealed ? 'disabled' : ''}>
                  <span class="choice-letter">${letter(i)}</span>
                  <span>${c}</span>
                </button>
              `;
            }).join('')}
          </div>

          ${revealed ? `
            <div class="explanation-box">
              <div class="explanation-header">
                <span class="explanation-label">Explanation</span>
                <span class="answer-pill ${userAnswer !== q.correct ? 'was-wrong' : ''}">
                  Answer: ${letter(q.correct)}
                </span>
              </div>
              ${(userAnswer !== q.correct && q.wrongExplanations && q.wrongExplanations[userAnswer]) ? `
                <div class="wrong-answer-block">
                  <span class="wrong-answer-label">Why your answer was wrong</span>
                  <div class="wrong-answer-text"><strong>${letter(userAnswer)}.</strong>${q.wrongExplanations[userAnswer]}</div>
                </div>
              ` : ''}
              <div class="formal-block">${q.formal}</div>
              ${q.informal ? `
                <div class="pearl-block">
                  <span class="pearl-label"><img src="${DEO_AVATAR}" class="deo-avatar" alt="Dr. Deo" /> Dr. Deo's Pearl</span>
                  <div class="pearl-text">${q.informal}</div>
                </div>
              ` : ''}
              <span class="reference-tag">📖 ${q.reference}</span>
              ${renderImageAttribution(q)}
            </div>
          ` : ''}
        </div>

        <div class="action-bar">
          <span class="question-counter">${m.correctAnswered}/${m.questionsAnswered} correct so far</span>
          ${!revealed ? `
            <button class="btn btn-primary" style="background:var(--teal); border-color:var(--teal);" onclick="Views._mountainCheck()" ${userAnswer === undefined || userAnswer === null ? 'disabled' : ''}>
              Check answer
            </button>
          ` : `
            <button class="btn btn-primary" style="background:var(--teal); border-color:var(--teal);" onclick="Views._mountainNext()">
              ${m.questionsAnswered + 1 >= m.target ? 'See summit results →' : 'Next question →'}
            </button>
          `}
        </div>
      </div>
    `;
  },

  _mountainSelect(idx) {
    if (State.currentMountainRevealed) return;
    State.currentMountainAnswer = idx;
    Views.mountain();
  },

  _mountainCheck() {
    if (State.currentMountainAnswer === null || State.currentMountainAnswer === undefined) return;
    const m = State.mountain;
    const qIdx = State.currentMountainQ;
    const q = QUESTIONS[qIdx];
    const isCorrect = State.currentMountainAnswer === q.correct;

    Stats.recordAnswer(q.id, isCorrect);
    m.questionsAnswered += 1;
    if (isCorrect) m.correctAnswered += 1;
    m.history.push({ qid: q.id, level: m.level, correct: isCorrect });

    // Update streaks BEFORE level transitions
    if (isCorrect) {
      m.streakCorrect += 1;
      m.streakWrong = 0;
    } else {
      m.streakWrong += 1;
      m.streakCorrect = 0;
    }

    // Track summit time: if currently at level 3, accumulate the time we just spent there
    // up through *this* question (we'll re-snap when level changes).
    if (m.level === 3 && m.summitStartTime) {
      const now = Date.now();
      m.summitTimeSec += Math.floor((now - m.summitStartTime) / 1000);
      m.summitStartTime = now;
    }

    // Level transitions
    if (isCorrect && m.streakCorrect >= 3 && m.level < 3) {
      m.level += 1;
      m.streakCorrect = 0;
      m.streakWrong = 0;
      m.currentLevelStartTime = Date.now();
      if (m.level > m.peakLevel) m.peakLevel = m.level;
      if (m.level === 3) m.summitStartTime = Date.now();
    } else if (!isCorrect && m.streakWrong >= 2 && m.level > 1) {
      // If we were at summit, finalize summit time before descending
      if (m.level === 3 && m.summitStartTime) {
        m.summitStartTime = null; // already accumulated above
      }
      m.level -= 1;
      m.streakCorrect = 0;
      m.streakWrong = 0;
      m.currentLevelStartTime = Date.now();
    }

    State.currentMountainRevealed = true;
    Views.mountain();
  },

  _mountainNext() {
    State.currentMountainQ = null;
    State.currentMountainAnswer = null;
    State.currentMountainRevealed = false;
    Views.mountain();
  },

  _mountainAbort() {
    Modal.show({
      title: "End the climb?",
      text: "You'll see your peak and summit time so far. The climb won't be recorded as a full test.",
      confirmLabel: "End climb",
      onConfirm: () => Views.mountainSummit()
    });
  },

  mountainSummit() {
    const m = State.mountain;
    if (!m) { App.go("home"); return; }

    // Finalize summit time if we're still on the summit
    if (m.level === 3 && m.summitStartTime) {
      m.summitTimeSec += Math.floor((Date.now() - m.summitStartTime) / 1000);
      m.summitStartTime = null;
    }

    const peakName = m.peakLevel === 1 ? "Foothills" : m.peakLevel === 2 ? "Ridge" : "Summit";
    const peakEmoji = m.peakLevel === 1 ? "🌲" : m.peakLevel === 2 ? "⛰️" : "🏔️";
    const reachedSummit = m.peakLevel === 3;
    const totalTimeSec = Math.floor((Date.now() - m.startTime) / 1000);
    const accuracy = m.questionsAnswered > 0 ? Math.round((m.correctAnswered / m.questionsAnswered) * 100) : 0;

    // Record the climb as a test entry so it shows up in history & dashboard
    const missedIds = m.history.filter(h => !h.correct).map(h => h.qid);
    Stats.recordTest(m.correctAnswered, m.questionsAnswered, totalTimeSec, missedIds, "mountain");

    let quote;
    if (reachedSummit && m.summitTimeSec >= 120) {
      quote = "Held the summit for real time. That's not luck — that's mastery on hard questions.";
    } else if (reachedSummit) {
      quote = "Reached the summit. Next time, see how long you can stay up there.";
    } else if (m.peakLevel === 2) {
      quote = "Solid climb to the Ridge. The Summit is within reach — string together three Mediums next time and you're there.";
    } else {
      quote = "Every climb starts in the Foothills. The mountain isn't going anywhere.";
    }

    App.el().innerHTML = `
      <div class="fade-in">
        <div class="summit-cert">
          <div class="summit-eyebrow">${reachedSummit ? '🏔️ Summit reached' : '⛰️ Climb complete'}</div>
          <div class="summit-title">Peak: <em>${peakEmoji} ${peakName}</em></div>
          <div style="font-family:var(--font-serif); color:var(--ink-muted); font-size:1rem;">
            ${m.correctAnswered} correct out of ${m.questionsAnswered} attempted
          </div>

          <div class="summit-stats">
            <div class="summit-stat">
              <div class="summit-stat-val">${peakName}</div>
              <div class="summit-stat-lbl">Peak elevation</div>
            </div>
            <div class="summit-stat">
              <div class="summit-stat-val">${reachedSummit ? fmtTime(m.summitTimeSec) : '—'}</div>
              <div class="summit-stat-lbl">Time at summit</div>
            </div>
            <div class="summit-stat">
              <div class="summit-stat-val">${accuracy}%</div>
              <div class="summit-stat-lbl">Overall accuracy</div>
            </div>
          </div>

          <div class="summit-quote">"${quote}"</div>
        </div>

        <div style="display:flex; gap:0.75rem; justify-content:center; flex-wrap:wrap; margin-bottom:2rem;">
          <button class="btn btn-secondary" onclick="App.go('home')">Back to home</button>
          <button class="btn btn-primary" style="background:var(--teal); border-color:var(--teal);" onclick="App.go('mountainSetup')">Climb again</button>
        </div>

        <div class="dashboard-section">
          <div class="dashboard-section-title">Climb log</div>
          <div class="dashboard-section-sub">Question by question, what level you were on and how it went.</div>
          ${m.history.map((h, i) => {
            const lvl = h.level === 1 ? '🌲 Foothills' : h.level === 2 ? '⛰️ Ridge' : '🏔️ Summit';
            return `
              <div style="display:flex; justify-content:space-between; align-items:center; padding:0.5rem 0; border-bottom:1px dashed var(--border); font-family:var(--font-mono); font-size:0.85rem;">
                <span style="color:var(--ink-muted);">Q${i+1} · ${h.qid}</span>
                <span>${lvl}</span>
                <span style="color:${h.correct ? 'var(--success)' : 'var(--error)'}; font-weight:600;">${h.correct ? '✓ correct' : '✗ wrong'}</span>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;

    // Clean up so a navigate-away doesn't leave stale state
    State.mountain = null;
    State.currentMountainQ = null;
    State.currentMountainAnswer = null;
    State.currentMountainRevealed = false;
  },

  /* ---------- HISTORY ---------- */
  history() {
    const data = Stats.load();
    App.el().innerHTML = `
      <div class="fade-in">
        <button class="btn btn-ghost" onclick="App.go('home')" style="margin-bottom: 1rem;">← Home</button>
        <h2 style="font-family: var(--font-serif); font-weight: 500; color: var(--ink); margin-bottom: 1.5rem;">Test history</h2>
        ${data.tests.length === 0 ? `
          <div class="empty-state">No tests completed yet. Take one in Test Mode and your scores will appear here.</div>
        ` : `
          <div class="results-list">
            ${[...data.tests].reverse().map(t => {
              const pct = Math.round((t.score / t.total) * 100);
              const modeLabel = t.mode ? (t.mode.charAt(0).toUpperCase() + t.mode.slice(1)) : "Custom";
              return `
                <div class="result-row ${pct >= 70 ? '' : 'incorrect'}">
                  <div class="result-row-header">
                    <span class="result-q-id">${fmtDate(t.date)} · ${modeLabel}</span>
                    <span class="result-status ${pct >= 70 ? 'correct' : 'incorrect'}">${pct}%</span>
                  </div>
                  <div class="result-detail">
                    <strong>${t.score} / ${t.total}</strong> in ${fmtDuration(t.durationSec)}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `}
      </div>
    `;
  }
};

App.go("home");
</script>
</body>
</html>
