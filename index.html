<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Retina Review — BCSC Board Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* Color system — warm scholarly palette */
    --bg: #f4efe4;
    --bg-elevated: #faf6ec;
    --surface: #ffffff;
    --surface-soft: #fbf8f0;
    --ink: #1a1612;
    --ink-soft: #2a2520;
    --ink-muted: #6b655c;
    --ink-faint: #9a9388;
    --border: #d8cfba;
    --border-strong: #b8ad94;
    --accent: #7c2d3a;
    --accent-soft: #f3e1e3;
    --accent-hover: #621f2a;
    --success: #2c5f4e;
    --success-soft: #dde9e2;
    --error: #a8334a;
    --error-soft: #f4dde1;
    --warning: #b8651a;
    --warning-soft: #f5e3cd;
    --gold: #8b6f1f;
    --teal: #1f5c6f;
    --teal-soft: #d8e6eb;

    /* Typography */
    --font-serif: 'IBM Plex Serif', Georgia, serif;
    --font-sans: 'IBM Plex Sans', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', 'SF Mono', Consolas, monospace;

    /* Spacing & radius */
    --radius-sm: 4px;
    --radius: 6px;
    --radius-lg: 10px;
    --shadow-sm: 0 1px 2px rgba(26, 22, 18, 0.05);
    --shadow: 0 2px 8px rgba(26, 22, 18, 0.06), 0 1px 2px rgba(26, 22, 18, 0.04);
    --shadow-lg: 0 8px 24px rgba(26, 22, 18, 0.08), 0 2px 6px rgba(26, 22, 18, 0.04);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(124, 45, 58, 0.015) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(44, 95, 78, 0.015) 0%, transparent 40%);
    z-index: 0;
  }

  #app {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header.site-header {
    border-bottom: 1px solid var(--border);
    background: var(--bg-elevated);
    padding: 1rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 0.85rem;
    cursor: pointer;
    user-select: none;
  }

  .brand-avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--accent);
    background: var(--surface);
    flex-shrink: 0;
    transition: transform 0.2s ease, border-color 0.2s ease;
  }

  .brand:hover .brand-avatar {
    transform: scale(1.05);
    border-color: var(--accent-hover);
  }

  .brand-mark {
    font-family: var(--font-serif);
    font-weight: 600;
    font-style: italic;
    font-size: 1.5rem;
    color: var(--accent);
    letter-spacing: -0.01em;
  }

  .brand-title {
    font-family: var(--font-serif);
    font-weight: 500;
    font-size: 1.15rem;
    color: var(--ink);
    letter-spacing: -0.01em;
  }

  .brand-sub {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--ink-muted);
    border-left: 1px solid var(--border-strong);
    padding-left: 0.75rem;
  }

  .header-actions {
    display: flex;
    gap: 0.5rem;
    align-items: center;
  }

  main {
    flex: 1;
    padding: 2rem 1.5rem;
    width: 100%;
    max-width: 920px;
    margin: 0 auto;
  }

  .btn {
    font-family: var(--font-sans);
    font-size: 0.92rem;
    font-weight: 500;
    padding: 0.6rem 1.1rem;
    border-radius: var(--radius);
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    background: transparent;
    color: var(--ink);
  }

  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .btn-primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); box-shadow: var(--shadow); }

  .btn-secondary {
    background: var(--surface);
    color: var(--ink);
    border-color: var(--border-strong);
  }
  .btn-secondary:hover { background: var(--surface-soft); border-color: var(--ink-muted); }

  .btn-ghost {
    background: transparent;
    color: var(--ink-muted);
    border-color: transparent;
  }
  .btn-ghost:hover { color: var(--ink); background: var(--surface-soft); }

  .btn-large {
    padding: 0.9rem 1.6rem;
    font-size: 1rem;
  }

  /* Home view */
  .home-hero {
    padding: 2rem 0 2.5rem;
    text-align: center;
    border-bottom: 1px solid var(--border);
    margin-bottom: 2.5rem;
  }

  .home-eyebrow {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--accent);
    margin-bottom: 1rem;
  }

  .home-title {
    font-family: var(--font-serif);
    font-size: 2.5rem;
    font-weight: 500;
    line-height: 1.1;
    letter-spacing: -0.02em;
    color: var(--ink);
    margin-bottom: 0.75rem;
  }

  .home-title em {
    font-style: italic;
    color: var(--accent);
  }

  .home-sub {
    font-family: var(--font-serif);
    font-size: 1.1rem;
    color: var(--ink-muted);
    max-width: 540px;
    margin: 0 auto;
    font-style: italic;
  }

  .mode-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1rem;
    margin-bottom: 2.5rem;
  }

  @media (max-width: 640px) {
    .mode-grid { grid-template-columns: 1fr; }
    .home-title { font-size: 1.9rem; }
    main { padding: 1.5rem 1rem; }
  }

  .mode-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1.75rem;
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
    overflow: hidden;
  }

  .mode-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 4px;
    height: 100%;
    background: var(--accent);
    transform: scaleY(0);
    transform-origin: top;
    transition: transform 0.25s ease;
  }

  .mode-card:hover {
    border-color: var(--border-strong);
    box-shadow: var(--shadow);
    transform: translateY(-2px);
  }
  .mode-card:hover::before { transform: scaleY(1); }

  .mode-card.test::before { background: var(--gold); }

  .mode-icon {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin-bottom: 0.5rem;
  }

  .mode-name {
    font-family: var(--font-serif);
    font-size: 1.5rem;
    font-weight: 500;
    color: var(--ink);
    margin-bottom: 0.5rem;
    letter-spacing: -0.01em;
  }

  .mode-desc {
    font-size: 0.92rem;
    color: var(--ink-muted);
    line-height: 1.55;
  }

  /* Stats panel */
  .stats-panel {
    background: var(--surface-soft);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1.5rem;
    margin-bottom: 2rem;
  }

  .stats-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 1.25rem;
    padding-bottom: 0.75rem;
    border-bottom: 1px dashed var(--border-strong);
  }

  .stats-title {
    font-family: var(--font-serif);
    font-size: 1.1rem;
    font-weight: 500;
    font-style: italic;
    color: var(--ink);
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1rem;
  }

  @media (max-width: 640px) {
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
  }

  .stat {
    text-align: left;
  }

  .stat-value {
    font-family: var(--font-serif);
    font-size: 1.75rem;
    font-weight: 500;
    color: var(--ink);
    line-height: 1.1;
    margin-bottom: 0.25rem;
  }

  .stat-label {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--ink-muted);
  }

  /* Question UI */
  .question-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.25rem;
    flex-wrap: wrap;
    gap: 0.75rem;
  }

  .question-id {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--ink-muted);
    letter-spacing: 0.05em;
  }

  .question-counter {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--ink-muted);
  }

  .difficulty-badge {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    padding: 0.2rem 0.5rem;
    border-radius: var(--radius-sm);
    border: 1px solid;
  }

  .difficulty-easy { color: var(--success); border-color: var(--success); background: var(--success-soft); }
  .difficulty-medium { color: var(--warning); border-color: var(--warning); background: var(--warning-soft); }
  .difficulty-hard { color: var(--error); border-color: var(--error); background: var(--error-soft); }

  .topic-tag {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-muted);
    padding: 0.2rem 0.5rem;
    border-radius: var(--radius-sm);
    background: var(--surface-soft);
    border: 1px solid var(--border);
  }

  .question-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 2rem;
    box-shadow: var(--shadow-sm);
    margin-bottom: 1.5rem;
  }

  @media (max-width: 640px) {
    .question-card { padding: 1.25rem; }
  }

  .question-prompt {
    font-family: var(--font-serif);
    font-size: 1.15rem;
    line-height: 1.65;
    color: var(--ink);
    font-weight: 500;
    margin-bottom: 1.5rem;
    padding-bottom: 1.25rem;
    border-bottom: 1px dashed var(--border);
  }

  /* Image rendering for image-based questions */
  .question-image-figure {
    margin: 0 0 1.5rem;
    background: var(--surface-soft);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    text-align: center;
  }

  .question-image {
    display: block;
    max-width: 100%;
    max-height: 460px;
    margin: 0 auto;
    background: var(--ink-soft);
    object-fit: contain;
  }

  .question-image-loading {
    padding: 4rem 1rem;
    color: var(--ink-faint);
    font-family: var(--font-mono);
    font-size: 0.8rem;
    text-align: center;
  }

  .question-image-error {
    padding: 2rem 1rem;
    color: var(--ink-muted);
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 0.9rem;
    text-align: center;
  }

  .question-image-error a {
    color: var(--accent);
    text-decoration: underline;
  }

  .image-caption {
    padding: 0.6rem 1rem;
    background: var(--surface);
    border-top: 1px solid var(--border);
    font-family: var(--font-mono);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
  }

  .image-caption a {
    color: var(--teal);
    text-decoration: none;
    border-bottom: 1px dotted var(--teal);
  }

  .image-caption a:hover {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  /* Image attribution panel — appears with the explanation */
  .image-attribution {
    background: var(--surface-soft);
    border: 1px solid var(--border);
    border-left: 3px solid var(--teal);
    border-radius: var(--radius);
    padding: 0.85rem 1rem;
    margin-top: 1rem;
    font-size: 0.82rem;
    color: var(--ink-muted);
    line-height: 1.55;
    font-family: var(--font-sans);
  }

  .image-attribution-label {
    display: block;
    font-family: var(--font-mono);
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--teal);
    font-weight: 600;
    margin-bottom: 0.35rem;
  }

  .image-attribution strong {
    color: var(--ink);
    font-weight: 500;
  }

  .image-attribution a {
    color: var(--teal);
    text-decoration: none;
    border-bottom: 1px dotted var(--teal);
  }

  .image-attribution a:hover {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  /* Image badge in question meta */
  .image-badge {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--teal);
    padding: 0.2rem 0.5rem;
    border-radius: var(--radius-sm);
    background: var(--teal-soft);
    border: 1px solid var(--teal);
  }

  .choices {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  .choice {
    display: flex;
    align-items: flex-start;
    gap: 0.85rem;
    padding: 0.9rem 1.1rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.15s ease;
    font-size: 0.96rem;
    line-height: 1.5;
    color: var(--ink-soft);
    text-align: left;
    width: 100%;
    font-family: var(--font-sans);
  }

  .choice:hover:not(:disabled) {
    border-color: var(--ink-muted);
    background: var(--surface-soft);
  }

  .choice-letter {
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 0.85rem;
    color: var(--ink-muted);
    min-width: 1.5rem;
    padding-top: 0.05rem;
  }

  .choice.selected {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .choice.selected .choice-letter { color: var(--accent); }

  .choice.correct {
    border-color: var(--success);
    background: var(--success-soft);
    color: var(--ink);
  }
  .choice.correct .choice-letter { color: var(--success); }

  .choice.incorrect {
    border-color: var(--error);
    background: var(--error-soft);
    color: var(--ink);
  }
  .choice.incorrect .choice-letter { color: var(--error); }

  .choice:disabled { cursor: default; }

  .choice.eliminated {
    opacity: 0.4;
    text-decoration: line-through;
    text-decoration-color: var(--ink-muted);
    text-decoration-thickness: 1.5px;
    cursor: not-allowed;
    background: var(--surface-soft);
  }
  .choice.eliminated:hover {
    background: var(--surface-soft);
    border-color: var(--border);
    transform: none;
  }
  .choice.eliminated .choice-letter { text-decoration: line-through; }

  /* Explanation rendering */
  .explanation-box {
    margin-top: 1.5rem;
    padding-top: 1.5rem;
    border-top: 2px solid var(--border);
    animation: slideDown 0.3s ease;
  }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .explanation-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 1rem;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .explanation-label {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--ink-muted);
  }

  .answer-pill {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    font-weight: 600;
    padding: 0.3rem 0.7rem;
    border-radius: var(--radius-sm);
    background: var(--success-soft);
    color: var(--success);
    border: 1px solid var(--success);
  }

  .answer-pill.was-wrong {
    background: var(--error-soft);
    color: var(--error);
    border-color: var(--error);
  }

  .formal-block {
    font-family: var(--font-serif);
    font-size: 1rem;
    line-height: 1.65;
    color: var(--ink-soft);
    margin-bottom: 1.25rem;
  }

  .pearl-block {
    background: var(--teal-soft);
    border-left: 4px solid var(--teal);
    border-radius: var(--radius);
    padding: 1rem 1.2rem;
    margin-bottom: 1rem;
  }

  .pearl-label {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--teal);
    margin-bottom: 0.6rem;
  }

  .pearl-text {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 1rem;
    color: var(--ink);
    line-height: 1.6;
  }

  /* Avatar — Dr. Deo branding */
  .deo-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--teal);
    background: var(--surface);
    flex-shrink: 0;
    vertical-align: middle;
  }

  .deo-avatar-sm {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    object-fit: cover;
    border: 1.5px solid var(--ink-muted);
    background: var(--surface);
    flex-shrink: 0;
    vertical-align: middle;
  }

  .deo-avatar-warning {
    border-color: var(--warning);
  }

  /* Hint box — for Dr. Deo's hints */
  .hint-box {
    background: var(--warning-soft);
    border: 1px solid var(--warning);
    border-left-width: 4px;
    border-radius: var(--radius);
    padding: 1rem 1.2rem;
    margin-bottom: 1rem;
    animation: slideDown 0.25s ease;
  }

  .hint-label {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--warning);
    margin-bottom: 0.6rem;
  }

  .hint-text {
    font-family: var(--font-serif);
    font-weight: 500;
    font-size: 0.98rem;
    color: var(--ink);
    line-height: 1.6;
  }

  /* Hint button with avatar */
  .deo-hint-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
  }

  .deo-hint-btn img {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    object-fit: cover;
    border: 1.5px solid var(--ink-muted);
  }

  .deo-hint-btn:hover img {
    border-color: var(--warning);
  }

  .reference-tag {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--gold);
    background: #fbf3dc;
    padding: 0.35rem 0.7rem;
    border-radius: var(--radius-sm);
    border: 1px solid #e8d49a;
  }

  /* Action bar */
  .action-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.75rem;
    flex-wrap: wrap;
  }

  .action-group {
    display: flex;
    gap: 0.5rem;
    align-items: center;
    flex-wrap: wrap;
  }

  /* Test setup */
  .setup-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 2rem;
    box-shadow: var(--shadow-sm);
  }

  @media (max-width: 640px) {
    .setup-card { padding: 1.5rem; }
  }

  .setup-title {
    font-family: var(--font-serif);
    font-size: 1.6rem;
    font-weight: 500;
    margin-bottom: 0.5rem;
    color: var(--ink);
    letter-spacing: -0.01em;
  }

  .setup-sub {
    color: var(--ink-muted);
    margin-bottom: 1.75rem;
    font-family: var(--font-serif);
    font-style: italic;
  }

  .field-group {
    margin-bottom: 1.5rem;
  }

  .field-label {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--ink-muted);
    margin-bottom: 0.7rem;
    display: block;
  }

  .field-options {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
  }

  .field-option {
    padding: 0.6rem 1.1rem;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    background: var(--surface);
    cursor: pointer;
    font-family: var(--font-sans);
    font-size: 0.92rem;
    color: var(--ink);
    transition: all 0.15s ease;
  }

  .field-option:hover { background: var(--surface-soft); }

  .field-option.active {
    background: var(--ink);
    color: var(--bg-elevated);
    border-color: var(--ink);
  }

  .preset-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.75rem;
    margin-bottom: 1.5rem;
  }

  @media (max-width: 640px) {
    .preset-grid { grid-template-columns: 1fr; }
  }

  .preset-card {
    border: 1.5px solid var(--border-strong);
    border-radius: var(--radius);
    padding: 1.25rem 1rem;
    background: var(--surface);
    cursor: pointer;
    transition: all 0.15s ease;
    text-align: center;
  }

  .preset-card:hover {
    border-color: var(--accent);
    background: var(--surface-soft);
    transform: translateY(-1px);
  }

  .preset-card.active {
    border-color: var(--accent);
    background: var(--accent-soft);
    border-width: 1.5px;
  }

  .preset-name {
    font-family: var(--font-serif);
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 0.25rem;
  }

  .preset-detail {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-muted);
    margin-bottom: 0.4rem;
  }

  .preset-meta {
    font-size: 0.82rem;
    color: var(--ink-muted);
    font-family: var(--font-sans);
    line-height: 1.4;
  }

  .preset-card.active .preset-name { color: var(--accent); }

  .pacing-info {
    background: var(--surface-soft);
    border: 1px dashed var(--border-strong);
    border-radius: var(--radius);
    padding: 1rem 1.2rem;
    margin: 1.5rem 0;
    font-family: var(--font-serif);
    color: var(--ink-soft);
    font-size: 0.95rem;
    line-height: 1.55;
  }

  .pacing-info strong {
    color: var(--accent);
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 0.9rem;
  }

  /* Custom controls */
  .number-input {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .number-input input {
    font-family: var(--font-mono);
    font-size: 1rem;
    padding: 0.55rem 0.8rem;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--ink);
    width: 100px;
  }

  .number-input input:focus {
    outline: none;
    border-color: var(--accent);
  }

  /* Chapter selector */
  .chapter-select {
    width: 100%;
    font-family: var(--font-sans);
    font-size: 0.95rem;
    padding: 0.65rem 0.9rem;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
  }

  .chapter-select:focus {
    outline: none;
    border-color: var(--accent);
  }

  .small-info {
    font-family: var(--font-sans);
    font-size: 0.85rem;
    color: var(--ink-muted);
    margin-top: 0.5rem;
    font-style: italic;
  }

  /* Test header (timer) */
  .test-header {
    background: var(--ink);
    color: var(--bg-elevated);
    padding: 0.85rem 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--ink-soft);
  }

  .test-header-info {
    display: flex;
    gap: 1.5rem;
    align-items: center;
    font-family: var(--font-mono);
    font-size: 0.85rem;
  }

  .timer {
    font-family: var(--font-mono);
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    padding: 0.3rem 0.8rem;
    border-radius: var(--radius);
    background: rgba(255,255,255,0.08);
  }

  .timer.warning { color: #f5b86b; background: rgba(245, 184, 107, 0.15); }
  .timer.critical {
    color: #ff8a8a;
    background: rgba(255, 138, 138, 0.18);
    animation: pulse 1.2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.65; }
  }

  /* Question navigator (test mode) */
  .nav-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(36px, 1fr));
    gap: 0.35rem;
    margin-top: 1rem;
    max-height: 400px;
    overflow-y: auto;
    padding: 0.25rem;
  }

  .nav-cell {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    background: var(--surface);
    color: var(--ink-muted);
    transition: all 0.12s ease;
    position: relative;
  }

  .nav-cell:hover { border-color: var(--ink-muted); }
  .nav-cell.answered { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .nav-cell.flagged::after {
    content: '';
    position: absolute;
    top: 2px; right: 2px;
    width: 6px; height: 6px;
    background: var(--gold);
    border-radius: 50%;
  }
  .nav-cell.current {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
  }

  /* Results */
  .results-hero {
    text-align: center;
    padding: 2rem 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 2rem;
  }

  .score-display {
    font-family: var(--font-serif);
    font-size: 4.5rem;
    font-weight: 500;
    line-height: 1;
    color: var(--ink);
    margin: 0.5rem 0;
    letter-spacing: -0.03em;
  }

  .score-display .denominator {
    font-size: 2rem;
    color: var(--ink-muted);
    font-style: italic;
  }

  .score-percent {
    font-family: var(--font-mono);
    font-size: 1.1rem;
    color: var(--accent);
    margin-bottom: 1rem;
  }

  .results-list {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .result-row {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--success);
    border-radius: var(--radius);
    padding: 1.25rem;
  }

  .result-row.incorrect { border-left-color: var(--error); }
  .result-row.unanswered { border-left-color: var(--ink-muted); }

  .result-row-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
    margin-bottom: 0.5rem;
    flex-wrap: wrap;
  }

  .result-q-id {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--ink-muted);
  }

  .result-status {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 0.15rem 0.5rem;
    border-radius: var(--radius-sm);
  }
  .result-status.correct { color: var(--success); background: var(--success-soft); }
  .result-status.incorrect { color: var(--error); background: var(--error-soft); }
  .result-status.unanswered { color: var(--ink-muted); background: var(--surface-soft); }

  .result-q-text {
    font-family: var(--font-serif);
    font-size: 0.95rem;
    color: var(--ink-soft);
    margin-bottom: 0.6rem;
    line-height: 1.55;
  }

  .result-detail {
    font-size: 0.88rem;
    color: var(--ink-muted);
    margin-top: 0.4rem;
  }

  .result-detail strong { color: var(--ink); font-weight: 500; }

  .result-pearl {
    background: var(--teal-soft);
    border-left: 3px solid var(--teal);
    padding: 0.6rem 0.85rem;
    margin-top: 0.6rem;
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 0.88rem;
    color: var(--ink);
  }

  .results-summary-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.75rem;
    margin: 1.5rem 0 2rem;
  }

  @media (max-width: 540px) {
    .results-summary-stats { grid-template-columns: 1fr; }
  }

  .summary-stat {
    background: var(--surface-soft);
    border: 1px solid var(--border);
    padding: 1rem;
    border-radius: var(--radius);
    text-align: center;
  }

  .summary-stat-val {
    font-family: var(--font-serif);
    font-size: 1.5rem;
    font-weight: 500;
    color: var(--ink);
  }

  .summary-stat-lbl {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--ink-muted);
    margin-top: 0.2rem;
  }

  /* Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(26, 22, 18, 0.6);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }

  .modal {
    background: var(--bg-elevated);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-lg);
    padding: 2rem;
    max-width: 460px;
    width: 100%;
    box-shadow: var(--shadow-lg);
  }

  .modal-title {
    font-family: var(--font-serif);
    font-size: 1.3rem;
    margin-bottom: 0.75rem;
    color: var(--ink);
  }

  .modal-text {
    font-family: var(--font-serif);
    color: var(--ink-soft);
    margin-bottom: 1.5rem;
    line-height: 1.6;
  }

  .modal-actions {
    display: flex;
    gap: 0.75rem;
    justify-content: flex-end;
  }

  /* Footer */
  footer {
    border-top: 1px solid var(--border);
    padding: 1.25rem 1.5rem;
    text-align: center;
    color: var(--ink-faint);
    font-size: 0.8rem;
    font-family: var(--font-mono);
    letter-spacing: 0.05em;
  }

  .empty-state {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--ink-muted);
    font-family: var(--font-serif);
    font-style: italic;
  }

  .fade-in { animation: fadeIn 0.3s ease; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .flag-btn {
    background: transparent;
    border: 1px solid var(--border-strong);
    color: var(--ink-muted);
    font-family: var(--font-mono);
    font-size: 0.78rem;
    padding: 0.4rem 0.7rem;
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .flag-btn:hover { color: var(--gold); border-color: var(--gold); }
  .flag-btn.flagged { color: var(--gold); border-color: var(--gold); background: #fbf3dc; }

  .progress-bar {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    margin: 0.75rem 0 1rem;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.3s ease;
  }
</style>

const STORAGE_KEY = "retinaReview.v2";

const State = {
  mode: null,
  questionOrder: [],
  currentIdx: 0,
  answers: {},
  revealed: {},
  flagged: {},
  eliminated: {},
  hintsShown: {},
  testStartTime: null,
  testDurationSec: 0,
  testEndTime: null,
  timerInterval: null,
  config: {
    testCount: 10,
    pacingMode: "real",
    chapterFilter: "all",
    presetName: "sprint"
  },
  trainingConfig: {
    presetName: "sprint",
    chapterFilter: "images",
    customCount: 25
  }
};

const Stats = {
  load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return this.empty();
      return JSON.parse(raw);
    } catch (e) { return this.empty(); }
  },
  empty() {
    return {
      perQuestion: {},
      tests: []
    };
  },
  save(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  },
  recordAnswer(questionId, isCorrect) {
    const data = this.load();
    if (!data.perQuestion[questionId]) {
      data.perQuestion[questionId] = { seen: 0, correct: 0, lastSeen: null };
    }
    data.perQuestion[questionId].seen += 1;
    if (isCorrect) data.perQuestion[questionId].correct += 1;
    data.perQuestion[questionId].lastSeen = Date.now();
    this.save(data);
  },
  recordTest(score, total, durationSec, missedIds, mode) {
    const data = this.load();
    data.tests.push({
      date: Date.now(),
      score, total, durationSec,
      missed: missedIds,
      mode: mode || "custom"
    });
    this.save(data);
  },
  reset() {
    localStorage.removeItem(STORAGE_KEY);
  }
};

/* ============================================================
   HELPERS
   ============================================================ */
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function fmtTime(secs) {
  const h = Math.floor(secs / 3600);
  const m = Math.floor((secs % 3600) / 60);
  const s = secs % 60;
  if (h > 0) return `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  return `${m}:${String(s).padStart(2,"0")}`;
}

function fmtDuration(secs) {
  if (secs < 60) return `${secs} sec`;
  if (secs < 3600) return `${Math.round(secs/60)} min`;
  const h = Math.floor(secs / 3600);
  const m = Math.round((secs % 3600) / 60);
  return m > 0 ? `${h}h ${m}m` : `${h}h`;
}

function fmtDate(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
}

function difficultyClass(d) {
  return `difficulty-${d.toLowerCase()}`;
}

function letter(i) { return String.fromCharCode(65 + i); }

function questionsForChapter(chapter) {
  if (chapter === "all" || chapter === null || chapter === undefined) {
    return QUESTIONS.map((_, i) => i);
  }
  if (chapter === "images") {
    return QUESTIONS.map((q, i) => q.imageUrl ? i : -1).filter(i => i !== -1);
  }
  const ch = parseInt(chapter, 10);
  return QUESTIONS.map((q, i) => q.chapter === ch ? i : -1).filter(i => i !== -1);
}

function renderQuestionImage(q) {
  if (!q.imageUrl) return '';
  const credit = q.imageCredit || {};
  const sourceLabel = credit.source || 'External source';
  const sourceLink = q.imageSourceUrl || q.imageUrl;
  // The link text intentionally short — full attribution lives in the explanation panel below.
  return `
    <figure class="question-image-figure">
      <img class="question-image"
           src="${q.imageUrl}"
           alt="${(credit.title || 'Clinical image').replace(/"/g, '&quot;')}"
           onerror="this.outerHTML = '<div class=\\'question-image-error\\'>Image could not be loaded. <a href=\\'${sourceLink}\\' target=\\'_blank\\' rel=\\'noopener\\'>View at ${sourceLabel} →</a></div>'" />
      <figcaption class="image-caption">
        <span>📷 Image courtesy of ${sourceLabel}</span>
        <a href="${sourceLink}" target="_blank" rel="noopener noreferrer">View original case →</a>
      </figcaption>
    </figure>
  `;
}

function renderImageAttribution(q) {
  if (!q.imageUrl || !q.imageCredit) return '';
  const c = q.imageCredit;
  const parts = [];
  if (c.title) parts.push(`<strong>"${c.title}"</strong>`);
  if (c.contributor) parts.push(`Contributor: ${c.contributor}`);
  if (c.photographer) parts.push(`Photographer: ${c.photographer}`);
  if (c.license) parts.push(`License: ${c.license}`);
  const sourceLink = q.imageSourceUrl || q.imageUrl;
  return `
    <div class="image-attribution">
      <span class="image-attribution-label">📷 Image Attribution</span>
      Image reproduced for noncommercial educational use from <strong>${c.source || 'external source'}</strong>.
      ${parts.length ? '<br>' + parts.join(' · ') : ''}
      <br><a href="${sourceLink}" target="_blank" rel="noopener noreferrer">View original case at source →</a>
    </div>
  `;
}

const App = {
  el: () => document.getElementById("view"),

  go(view, opts = {}) {
    if (State.timerInterval) {
      clearInterval(State.timerInterval);
      State.timerInterval = null;
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
    Views[view](opts);
  },

  exportProgress() {
    const data = Stats.load();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `retina-review-progress-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  },

  confirmReset() {
    Modal.show({
      title: "Reset all progress?",
      text: "This will clear all stats, scores, and test history stored on this device. This cannot be undone.",
      confirmLabel: "Reset everything",
      onConfirm: () => {
        Stats.reset();
        App.go("home");
      }
    });
  }
};

const Modal = {
  show({ title, text, confirmLabel = "Confirm", cancelLabel = "Cancel", onConfirm }) {
    const existing = document.querySelector(".modal-backdrop");
    if (existing) existing.remove();

    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    backdrop.innerHTML = `
      <div class="modal">
        <div class="modal-title">${title}</div>
        <div class="modal-text">${text}</div>
        <div class="modal-actions">
          <button class="btn btn-ghost" id="modal-cancel">${cancelLabel}</button>
          <button class="btn btn-primary" id="modal-confirm">${confirmLabel}</button>
        </div>
      </div>
    `;
    document.body.appendChild(backdrop);
    backdrop.querySelector("#modal-cancel").onclick = () => backdrop.remove();
    backdrop.querySelector("#modal-confirm").onclick = () => {
      backdrop.remove();
      onConfirm && onConfirm();
    };
    backdrop.onclick = (e) => { if (e.target === backdrop) backdrop.remove(); };
  }
};

    State.eliminated = {};
    State.hintsShown = {};
    Views.training();
  },

  training() {
    const qIdx = State.questionOrder[State.currentIdx];
    const q = QUESTIONS[qIdx];
    const userAnswer = State.answers[qIdx];
    const isRevealed = State.revealed[qIdx];
    const isFlagged = State.flagged[qIdx];
    const isEliminated = State.eliminated[qIdx];
    const hintShown = State.hintsShown[qIdx];
    const progressPct = ((State.currentIdx + 1) / State.questionOrder.length) * 100;

    App.el().innerHTML = `
      <div class="fade-in">
        <div class="action-bar" style="margin-bottom: 0.5rem;">
          <button class="btn btn-ghost" onclick="App.go('home')">← Home</button>
          <span class="question-counter">Question ${State.currentIdx + 1} of ${State.questionOrder.length}</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width: ${progressPct}%"></div></div>

        <div class="question-meta">
          <div style="display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap;">
            <span class="question-id">${q.id}</span>
            <span class="difficulty-badge ${difficultyClass(q.difficulty)}">${q.difficulty}</span>
            <span class="topic-tag">Ch ${q.chapter} · ${q.topic}</span>
            ${q.imageUrl ? '<span class="image-badge">📷 Image</span>' : ''}
          </div>
          <button class="flag-btn ${isFlagged ? 'flagged' : ''}" onclick="Views._toggleFlag(${qIdx})">
            ${isFlagged ? '★ Flagged' : '☆ Flag'}
          </button>
        </div>

        <div class="question-card">
          ${renderQuestionImage(q)}
          <div class="question-prompt">${q.prompt}</div>

          ${hintShown && !isRevealed && q.informal ? `
            <div class="hint-box">
              <span class="hint-label"><img src="${DEO_AVATAR}" class="deo-avatar deo-avatar-warning" alt="Dr. Deo" /> Dr. Deo's Hint</span>
              <div class="hint-text">${q.informal}</div>
            </div>
          ` : ''}

          <div class="choices">
            ${q.choices.map((c, i) => {
              let cls = "choice";
              const isElim = isEliminated && isEliminated.includes(i);
              if (isRevealed) {
                if (i === q.correct) cls += " correct";
                else if (i === userAnswer) cls += " incorrect";
                else if (isElim) cls += " eliminated";
              } else {
                if (isElim) cls += " eliminated";
                if (userAnswer === i) cls += " selected";
              }
              return `
                <button class="${cls}" onclick="Views._selectTraining(${i})" ${isRevealed || isElim ? 'disabled' : ''}>
                  <span class="choice-letter">${letter(i)}</span>
                  <span>${c}</span>
                </button>
              `;
            }).join('')}
          </div>

          ${isRevealed ? `
            <div class="explanation-box">
              <div class="explanation-header">
                <span class="explanation-label">Explanation</span>
                <span class="answer-pill ${userAnswer !== q.correct ? 'was-wrong' : ''}">
                  Answer: ${letter(q.correct)}
                </span>
              </div>
              <div class="formal-block">${q.formal}</div>
              ${q.informal ? `
                <div class="pearl-block">
                  <span class="pearl-label"><img src="${DEO_AVATAR}" class="deo-avatar" alt="Dr. Deo" /> Dr. Deo's Pearl</span>
                  <div class="pearl-text">${q.informal}</div>
                </div>
              ` : ''}
              <span class="reference-tag">📖 ${q.reference}</span>
              ${renderImageAttribution(q)}
            </div>
          ` : ''}
        </div>

        <div class="action-bar">
          <div class="action-group">
            ${!isRevealed ? `
              ${q.informal ? `
                <button class="btn btn-ghost deo-hint-btn" onclick="Views._showHint()" ${hintShown ? 'disabled' : ''}>
                  <img src="${DEO_AVATAR}" alt="Dr. Deo" />
                  ${hintShown ? "✓ Hint shown" : "Dr. Deo's Hint"}
                </button>
              ` : ''}
              <button class="btn btn-ghost" onclick="Views._narrowChoices()" ${isEliminated ? 'disabled' : ''}>
                ${isEliminated ? '✓ Narrowed' : 'Narrow to 2'}
              </button>
            ` : ''}
          </div>
          <div class="action-group">
            <button class="btn btn-secondary" onclick="Views._navTraining(-1)" ${State.currentIdx === 0 ? 'disabled' : ''}>← Prev</button>
            ${!isRevealed ? `
              <button class="btn btn-primary" onclick="Views._checkAnswer()" ${userAnswer === undefined ? 'disabled' : ''}>
                Check answer
              </button>
            ` : `
              ${State.currentIdx === State.questionOrder.length - 1 ?
                `<button class="btn btn-primary" onclick="App.go('home')">Finish session</button>` :
                `<button class="btn btn-primary" onclick="Views._navTraining(1)">Next →</button>`
              }
            `}
          </div>
        </div>
      </div>
    `;
  },

  _selectTraining(choiceIdx) {
    const qIdx = State.questionOrder[State.currentIdx];
    if (State.revealed[qIdx]) return;
    if (State.eliminated[qIdx] && State.eliminated[qIdx].includes(choiceIdx)) return;
    State.answers[qIdx] = choiceIdx;
    Views.training();
  },

  _checkAnswer() {
    const qIdx = State.questionOrder[State.currentIdx];
    const q = QUESTIONS[qIdx];
    const userAnswer = State.answers[qIdx];
    if (userAnswer === undefined) return;
    State.revealed[qIdx] = true;
    Stats.recordAnswer(q.id, userAnswer === q.correct);
    Views.training();
  },

  _showHint() {
    const qIdx = State.questionOrder[State.currentIdx];
    if (State.revealed[qIdx]) return;
    State.hintsShown[qIdx] = true;
    Views.training();
  },

  _narrowChoices() {
    const qIdx = State.questionOrder[State.currentIdx];
    if (State.revealed[qIdx]) return;
    if (State.eliminated[qIdx]) return;

    const q = QUESTIONS[qIdx];
    const userAnswer = State.answers[qIdx];
    const totalChoices = q.choices.length;
    const numToEliminate = totalChoices - 2;

    let candidates = [];
    for (let i = 0; i < totalChoices; i++) {
      if (i !== q.correct && i !== userAnswer) candidates.push(i);
    }
    candidates = shuffle(candidates).slice(0, numToEliminate);
    State.eliminated[qIdx] = candidates;
    Views.training();
  },

  _navTraining(direction) {
    State.currentIdx += direction;
    if (State.currentIdx < 0) State.currentIdx = 0;
    if (State.currentIdx >= State.questionOrder.length) State.currentIdx = State.questionOrder.length - 1;
    Views.training();
  },

  _toggleFlag(qIdx) {
    State.flagged[qIdx] = !State.flagged[qIdx];
    if (State.mode === "training") Views.training();
    else Views.test();
  },

  /* ---------- TEST SETUP ---------- */
  testSetup() {
    if (!State.config.presetName) State.config.presetName = "sprint";

    const PRESETS = {
      sprint: { name: "Sprint", count: 10, label: "10 questions · ~12 min", desc: "Quick warm-up. Real ABO pacing." },
      marathon: { name: "Marathon", count: 50, label: "50 questions · ~1 hour", desc: "Real test stamina. ABO pacing." },
      mock: { name: "Mock Board", count: 250, label: "250 questions · 5 hours", desc: "Full WQE simulation. Real ABO pacing." }
    };

    const drawSetup = () => {
      const preset = PRESETS[State.config.presetName] || null;
      const isCustom = State.config.presetName === "custom";
      const filteredCount = questionsForChapter(State.config.chapterFilter).length;
      const requestedCount = isCustom ? State.config.testCount : (preset ? preset.count : 10);
      const actualCount = Math.min(requestedCount, filteredCount);
      const totalSec = State.config.pacingMode === "real" ? actualCount * 72 : null;

      App.el().innerHTML = `
        <div class="fade-in">
          <button class="btn btn-ghost" onclick="App.go('home')" style="margin-bottom: 1rem;">← Home</button>
          <div class="setup-card">
            <div class="setup-title">Configure your test</div>
            <div class="setup-sub">The real ABO Written Qualifying Exam runs 250 questions in 5 hours — 72 seconds per question. Pick your distance.</div>

            <div class="field-group">
              <label class="field-label">Preset</label>
              <div class="preset-grid">
                ${Object.entries(PRESETS).map(([key, p]) => `
                  <div class="preset-card ${State.config.presetName === key ? 'active' : ''}" onclick="State.config.presetName = '${key}'; State.config.pacingMode = 'real'; Views._redrawTestSetup()">
                    <div class="preset-name">${p.name}</div>
                    <div class="preset-detail">${p.label}</div>
                    <div class="preset-meta">${p.desc}</div>
                  </div>
                `).join('')}
              </div>

              <div class="field-options">
                <button class="field-option ${isCustom ? 'active' : ''}"
                        onclick="State.config.presetName = 'custom'; Views._redrawTestSetup()">
                  Custom...
                </button>
              </div>

              ${isCustom ? `
                <div style="margin-top: 1rem; display: flex; gap: 1.25rem; align-items: center; flex-wrap: wrap;">
                  <div class="number-input">
                    <label style="font-family: var(--font-sans); font-size: 0.9rem; color: var(--ink-muted);">Questions:</label>
                    <input type="number" min="1" max="500" value="${State.config.testCount}"
                           oninput="State.config.testCount = parseInt(this.value) || 1; Views._redrawTestSetup()" />
                  </div>
                  <div class="field-options">
                    <button class="field-option ${State.config.pacingMode === 'real' ? 'active' : ''}"
                            onclick="State.config.pacingMode = 'real'; Views._redrawTestSetup()">
                      Timed (72s/q)
                    </button>
                    <button class="field-option ${State.config.pacingMode === 'untimed' ? 'active' : ''}"
                            onclick="State.config.pacingMode = 'untimed'; Views._redrawTestSetup()">
                      Untimed
                    </button>
                  </div>
                </div>
              ` : ''}
            </div>

            <div class="field-group">
              <label class="field-label">Focus area</label>
              <select class="chapter-select" onchange="State.config.chapterFilter = this.value; Views._redrawTestSetup()">
                <option value="all" ${State.config.chapterFilter === 'all' ? 'selected' : ''}>All chapters · ${QUESTIONS.length} questions</option>
                <option value="images" ${State.config.chapterFilter === 'images' ? 'selected' : ''}>📷 Image questions only · ${QUESTIONS.filter(q => q.imageUrl).length} q</option>
                ${Object.entries(CHAPTERS).map(([num, name]) => {
                  const count = QUESTIONS.filter(q => q.chapter === parseInt(num)).length;
                  return `<option value="${num}" ${State.config.chapterFilter === num ? 'selected' : ''}>Ch ${num}: ${name} · ${count} q</option>`;
                }).join('')}
              </select>
              ${State.config.chapterFilter !== 'all' && requestedCount > filteredCount ? `
                <div class="small-info">Note: this selection has only ${filteredCount} questions. Test will use all of them.</div>
              ` : ''}
            </div>

            <div class="pacing-info">
              ${State.config.pacingMode === "real" || !isCustom ?
                `You'll have <strong>${fmtTime(totalSec)}</strong> to answer <strong>${actualCount}</strong> question${actualCount !== 1 ? 's' : ''}. The clock starts when you click Begin.` :
                `<strong>${actualCount}</strong> questions, untimed. No clock pressure.`
              }
            </div>

            <button class="btn btn-primary btn-large" style="width: 100%;" onclick="Views.testStart()">
              Begin test
            </button>
          </div>
        </div>
      `;
    };
    Views._redrawTestSetup = drawSetup;
    drawSetup();
  },

  testStart() {
    const PRESETS = {
      sprint: 10, marathon: 50, mock: 250
    };
    const isCustom = State.config.presetName === "custom";
    const requestedCount = isCustom ? State.config.testCount : (PRESETS[State.config.presetName] || 10);

    State.mode = "test";
    const pool = questionsForChapter(State.config.chapterFilter);
    const actualCount = Math.min(requestedCount, pool.length);
    State.questionOrder = shuffle(pool).slice(0, actualCount);
    State.currentIdx = 0;
    State.answers = {};
    State.flagged = {};
    State.revealed = {};
    State.eliminated = {};
    State.testStartTime = Date.now();
    const useTimer = !isCustom || State.config.pacingMode === "real";
    State.testDurationSec = useTimer ? actualCount * 72 : null;
    State.testEndTime = State.testDurationSec ? State.testStartTime + State.testDurationSec * 1000 : null;
    Views.test();
    if (State.testDurationSec) Views._startTimer();
  },

  test() {
    const qIdx = State.questionOrder[State.currentIdx];
    const q = QUESTIONS[qIdx];
    const userAnswer = State.answers[qIdx];
    const isFlagged = State.flagged[qIdx];

    const headerHtml = `
      <div class="test-header" style="margin: -2rem -1.5rem 1.5rem;">
        <div class="test-header-info">
          <span>Test Mode</span>
          <span style="opacity:0.6;">·</span>
          <span>Q ${State.currentIdx + 1} / ${State.questionOrder.length}</span>
        </div>
        <div class="test-header-info">
          ${State.testDurationSec ? `<div class="timer" id="timer">--:--</div>` : `<span style="opacity:0.6;">Untimed</span>`}
          <button class="btn btn-secondary" style="font-size:0.8rem;padding:0.4rem 0.8rem;" onclick="Views._confirmEndTest()">End test</button>
        </div>
      </div>
    `;

    App.el().innerHTML = `
      <div class="fade-in">
        ${headerHtml}

        <div class="question-meta">
          <div style="display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap;">
            <span class="question-id">${q.id}</span>
            ${q.imageUrl ? '<span class="image-badge">📷 Image</span>' : ''}
          </div>
          <button class="flag-btn ${isFlagged ? 'flagged' : ''}" onclick="Views._toggleFlag(${qIdx})">
            ${isFlagged ? '★ Flagged' : '☆ Flag for review'}
          </button>
        </div>

        <div class="question-card">
          ${renderQuestionImage(q)}
          <div class="question-prompt">${q.prompt}</div>

          <div class="choices">
            ${q.choices.map((c, i) => {
              const cls = "choice" + (userAnswer === i ? " selected" : "");
              return `
                <button class="${cls}" onclick="Views._selectTest(${i})">
                  <span class="choice-letter">${letter(i)}</span>
                  <span>${c}</span>
                </button>
              `;
            }).join('')}
          </div>
        </div>

        <div class="action-bar" style="margin-bottom: 2rem;">
          <button class="btn btn-secondary" onclick="Views._navTest(-1)" ${State.currentIdx === 0 ? 'disabled' : ''}>← Prev</button>
          <span class="question-counter">${Object.keys(State.answers).length} of ${State.questionOrder.length} answered</span>
          ${State.currentIdx === State.questionOrder.length - 1 ?
            `<button class="btn btn-primary" onclick="Views._confirmSubmit()">Submit test</button>` :
            `<button class="btn btn-primary" onclick="Views._navTest(1)">Next →</button>`
          }
        </div>

        <div class="stats-panel">
          <div class="stats-header">
            <div class="stats-title">Question navigator</div>
            <div style="font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-muted);">
              <span style="color: var(--accent);">●</span> Answered &nbsp;
              <span style="color: var(--gold);">●</span> Flagged
            </div>
          </div>
          <div class="nav-grid">
            ${State.questionOrder.map((idx, i) => {
              let cls = "nav-cell";
              if (State.answers[idx] !== undefined) cls += " answered";
              if (State.flagged[idx]) cls += " flagged";
              if (i === State.currentIdx) cls += " current";
              return `<div class="${cls}" onclick="Views._jumpTo(${i})">${i + 1}</div>`;
            }).join('')}
          </div>
        </div>
      </div>
    `;

    if (State.testDurationSec) Views._updateTimer();
  },

  _startTimer() {
    if (State.timerInterval) clearInterval(State.timerInterval);
    State.timerInterval = setInterval(() => {
      Views._updateTimer();
    }, 1000);
  },

  _updateTimer() {
    const timerEl = document.getElementById("timer");
    if (!timerEl) return;
    const remaining = Math.max(0, Math.floor((State.testEndTime - Date.now()) / 1000));
    timerEl.textContent = fmtTime(remaining);
    timerEl.classList.remove("warning", "critical");
    const totalSec = State.testDurationSec;
    if (remaining <= 30 || remaining / totalSec < 0.05) timerEl.classList.add("critical");
    else if (remaining / totalSec < 0.2) timerEl.classList.add("warning");

    if (remaining <= 0) {
      clearInterval(State.timerInterval);
      State.timerInterval = null;
      Views._submitTest();
    }
  },

  _selectTest(choiceIdx) {
    const qIdx = State.questionOrder[State.currentIdx];
    State.answers[qIdx] = choiceIdx;
    Views.test();
  },

  _navTest(direction) {
    State.currentIdx += direction;
    if (State.currentIdx < 0) State.currentIdx = 0;
    if (State.currentIdx >= State.questionOrder.length) State.currentIdx = State.questionOrder.length - 1;
    Views.test();
  },

  _jumpTo(idx) {
    State.currentIdx = idx;
    Views.test();
  },

  _confirmSubmit() {
    const unanswered = State.questionOrder.filter(i => State.answers[i] === undefined).length;
    Modal.show({
      title: "Submit your test?",
      text: unanswered > 0 ?
        `You have ${unanswered} unanswered question${unanswered > 1 ? 's' : ''}. They will be marked incorrect.` :
        "All questions answered. Ready to see your results?",
      confirmLabel: "Submit",
      onConfirm: Views._submitTest
    });
  },

  _confirmEndTest() {
    Modal.show({
      title: "End test early?",
      text: "Your current answers will be scored. Unanswered questions will be marked incorrect.",
      confirmLabel: "End test",
      onConfirm: Views._submitTest
    });
  },

  _submitTest() {
    if (State.timerInterval) {
      clearInterval(State.timerInterval);
      State.timerInterval = null;
    }
    let correct = 0;
    const missedIds = [];
    State.questionOrder.forEach(idx => {
      const q = QUESTIONS[idx];
      const userAns = State.answers[idx];
      const isCorrect = userAns === q.correct;
      Stats.recordAnswer(q.id, isCorrect);
      if (isCorrect) correct += 1;
      else missedIds.push(q.id);
    });
    const elapsedSec = Math.floor((Date.now() - State.testStartTime) / 1000);
    const presetName = State.config.presetName === "custom" ? "custom" : State.config.presetName;
    Stats.recordTest(correct, State.questionOrder.length, elapsedSec, missedIds, presetName);
    Views.testResults({ correct, elapsedSec });
  },

  /* ---------- TEST RESULTS ---------- */
  testResults({ correct, elapsedSec }) {
    const total = State.questionOrder.length;
    const pct = Math.round((correct / total) * 100);
    const unanswered = State.questionOrder.filter(i => State.answers[i] === undefined).length;

    App.el().innerHTML = `
      <div class="fade-in">
        <div class="results-hero">
          <div style="font-family: var(--font-mono); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.18em; color: var(--ink-muted);">Test Complete</div>
          <div class="score-display">${correct}<span class="denominator">/${total}</span></div>
          <div class="score-percent">${pct}% · ${fmtTime(elapsedSec)}</div>
        </div>

        <div class="results-summary-stats">
          <div class="summary-stat">
            <div class="summary-stat-val">${correct}</div>
            <div class="summary-stat-lbl">Correct</div>
          </div>
          <div class="summary-stat">
            <div class="summary-stat-val">${total - correct - unanswered}</div>
            <div class="summary-stat-lbl">Incorrect</div>
          </div>
          <div class="summary-stat">
            <div class="summary-stat-val">${unanswered}</div>
            <div class="summary-stat-lbl">Unanswered</div>
          </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1rem;">
          <div style="font-family: var(--font-serif); font-size: 1.2rem; font-style: italic; color: var(--ink);">Review every question</div>
          <button class="btn btn-secondary" onclick="App.go('home')">Done</button>
        </div>

        <div class="results-list">
          ${State.questionOrder.map(idx => {
            const q = QUESTIONS[idx];
            const userAns = State.answers[idx];
            const isCorrect = userAns === q.correct;
            const isUnanswered = userAns === undefined;
            const cls = isUnanswered ? "unanswered" : (isCorrect ? "" : "incorrect");
            const status = isUnanswered ? "unanswered" : (isCorrect ? "correct" : "incorrect");
            return `
              <div class="result-row ${cls}">
                <div class="result-row-header">
                  <span class="result-q-id">${q.id} · Ch ${q.chapter}</span>
                  <span class="result-status ${status}">${status}</span>
                </div>
                <div class="result-q-text">${q.prompt}</div>
                <div class="result-detail">
                  <strong>Correct answer:</strong> ${letter(q.correct)}. ${q.choices[q.correct]}
                </div>
                ${!isUnanswered && !isCorrect ? `
                  <div class="result-detail">
                    <strong>Your answer:</strong> ${letter(userAns)}. ${q.choices[userAns]}
                  </div>
                ` : ''}
                <div class="result-detail" style="margin-top: 0.6rem; padding-top: 0.6rem; border-top: 1px dashed var(--border); font-family: var(--font-serif); color: var(--ink-soft);">
                  ${q.formal}
                </div>
                ${q.informal ? `
                  <div class="result-pearl"><img src="${DEO_AVATAR}" class="deo-avatar-sm" alt="Dr. Deo" style="margin-right: 0.4rem;" /><strong style="font-style:normal;font-family:var(--font-mono);font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--teal);">Dr. Deo's Pearl</strong> · ${q.informal}</div>
                ` : ''}
                <div style="margin-top: 0.6rem;">
                  <span class="reference-tag">📖 ${q.reference}</span>
                </div>
                ${renderImageAttribution(q)}
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
  },

  /* ---------- HISTORY ---------- */
  history() {
    const data = Stats.load();
    App.el().innerHTML = `
      <div class="fade-in">
        <button class="btn btn-ghost" onclick="App.go('home')" style="margin-bottom: 1rem;">← Home</button>
        <h2 style="font-family: var(--font-serif); font-weight: 500; color: var(--ink); margin-bottom: 1.5rem;">Test history</h2>
        ${data.tests.length === 0 ? `
          <div class="empty-state">No tests completed yet. Take one in Test Mode and your scores will appear here.</div>
        ` : `
          <div class="results-list">
            ${[...data.tests].reverse().map(t => {
              const pct = Math.round((t.score / t.total) * 100);
              const modeLabel = t.mode ? (t.mode.charAt(0).toUpperCase() + t.mode.slice(1)) : "Custom";
              return `
                <div class="result-row ${pct >= 70 ? '' : 'incorrect'}">
                  <div class="result-row-header">
                    <span class="result-q-id">${fmtDate(t.date)} · ${modeLabel}</span>
                    <span class="result-status ${pct >= 70 ? 'correct' : 'incorrect'}">${pct}%</span>
                  </div>
                  <div class="result-detail">
                    <strong>${t.score} / ${t.total}</strong> in ${fmtDuration(t.durationSec)}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `}
      </div>
    `;
  }
};

App.go("home");
</script>
</body>
</html>
